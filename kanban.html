<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warp — Kanban</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(13px,1.1vw,16px)}
:root{
  --bg:#080c14;--surface:#0e1521;--surface2:#141d2e;--surface3:#1a2438;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8edf5;--muted:#6b7a96;--dim:#3a4560;
  --pad:clamp(.75rem,2vw,1.5rem);
  --pri-high:#e74c3c;--pri-medium:#f1c40f;--pri-low:#2ecc71;
}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{position:sticky;top:0;z-index:200;background:rgba(8,12,20,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-top{padding:.6rem var(--pad);display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-wordmark{font-size:.6em;letter-spacing:.2em;color:var(--muted);font-family:'JetBrains Mono',monospace}
.header-title{font-size:1em;font-weight:800}
.overall-bar{display:flex;align-items:center;gap:.5rem}
.overall-label{font-size:.6em;letter-spacing:.1em;color:var(--muted);font-family:'JetBrains Mono',monospace}
.overall-track{width:clamp(60px,8vw,120px);height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.overall-fill{height:100%;background:linear-gradient(90deg,#1d4ed8,#3498db);border-radius:2px;transition:width .8s ease}
.overall-pct{font-size:.7em;font-weight:600;font-family:'JetBrains Mono',monospace;color:#3498db;min-width:28px}
.header-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sync-info{font-size:.6em;color:var(--dim);font-family:'JetBrains Mono',monospace}
.hbtn{padding:.35rem .7rem;background:transparent;border:1px solid var(--border2);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.65em;letter-spacing:.06em;cursor:pointer;transition:all .2s;white-space:nowrap}
.hbtn.blue{color:#3498db;border-color:rgba(52,152,219,.3)}.hbtn.blue:hover{background:rgba(52,152,219,.1);border-color:#3498db}
.hbtn.green{color:#2ecc71;border-color:rgba(46,204,113,.3)}.hbtn.green:hover{background:rgba(46,204,113,.1);border-color:#2ecc71}

/* TABS */
.tab-bar{display:flex;align-items:stretch;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 var(--pad);scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:.55rem .85rem;font-size:.72em;font-weight:600;letter-spacing:.03em;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--tab-color,#3498db)}
.tab-dot{width:6px;height:6px;border-radius:50%;background:var(--tab-color,#3498db);flex-shrink:0}
.tab-badge{font-size:.58em;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--muted);padding:.1rem .4rem;border-radius:10px;line-height:1.4}

/* BOARD */
.board-area{padding:var(--pad);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.5rem,1.5vw,1rem);align-items:start}
@media(max-width:640px){.board-area{grid-template-columns:1fr}}

/* ALL GRID */
.all-grid{padding:var(--pad);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(.5rem,1.2vw,.85rem);align-items:start}
@media(max-width:1100px){.all-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.all-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* COLUMN */
.col-wrap{display:flex;flex-direction:column;gap:.4rem;min-height:80px;border-radius:10px;transition:background .2s;padding:.25rem}
.col-wrap.drag-over{background:rgba(52,152,219,.06);outline:2px dashed rgba(52,152,219,.3)}
.col-header{padding:.5rem .7rem;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-bottom:.15rem}
.col-title{font-size:.72em;font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:.4rem}
.col-count-badge{font-size:.6em;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--muted);padding:.1rem .4rem;border-radius:10px}
.col-progress{height:2px;background:var(--surface2);border-radius:1px;overflow:hidden;margin-bottom:.4rem}
.col-fill{height:100%;border-radius:1px;transition:width .6s ease}
.col-empty{padding:1.25rem .75rem;text-align:center;color:var(--dim);font-size:.68em;font-family:'JetBrains Mono',monospace;border:1px dashed var(--border);border-radius:8px}
.col-add-btn{width:100%;padding:.45rem;background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--dim);font-size:.67em;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.col-add-btn:hover{border-color:var(--border2);color:var(--muted);background:var(--surface)}

/* PRIORITY GROUP HEADERS */
.pri-group-header{font-size:.58em;letter-spacing:.12em;font-family:'JetBrains Mono',monospace;color:var(--dim);padding:.2rem .4rem;margin-top:.4rem;display:flex;align-items:center;gap:.3rem}

/* MINI COL */
.mini-col{display:flex;flex-direction:column;gap:.35rem}
.mini-header{padding:.45rem .6rem;border-radius:8px;border-left:3px solid;background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-bottom:.15rem;cursor:pointer;transition:background .2s}
.mini-header:hover{background:var(--surface2)}
.mini-name{font-size:.68em;font-weight:600;display:flex;align-items:center;gap:.3rem}
.mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mini-meta{font-size:.58em;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.mini-progress{height:2px;background:var(--surface2);border-radius:1px;overflow:hidden;margin-bottom:.3rem}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem;border-left:3px solid;transition:border-color .2s,transform .15s,box-shadow .2s;cursor:pointer;position:relative}
.card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.card.dragging{opacity:.4;transform:scale(.97)}
.card.blocked{border-left-color:#e74c3c !important}
.card-top{display:flex;align-items:flex-start;gap:.35rem;margin-bottom:.35rem}
.card-status{width:14px;height:14px;border-radius:50%;border:1.5px solid;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;transition:all .2s;user-select:none}
.card-status:hover{transform:scale(1.2)}
.card-name{font-size:.78em;font-weight:600;line-height:1.4;flex:1;color:var(--text);word-break:break-word}
.card-priority{font-size:.56em;font-family:'JetBrains Mono',monospace;padding:.1rem .4rem;border-radius:4px;font-weight:700;letter-spacing:.06em;flex-shrink:0;margin-top:1px}
.pri-high{background:rgba(231,76,60,.15);color:var(--pri-high);border:1px solid rgba(231,76,60,.25)}
.pri-medium{background:rgba(241,196,15,.12);color:var(--pri-medium);border:1px solid rgba(241,196,15,.2)}
.pri-low{background:rgba(46,204,113,.12);color:var(--pri-low);border:1px solid rgba(46,204,113,.2)}
.card-notes{font-size:.66em;color:var(--muted);line-height:1.5;margin-bottom:.35rem;font-family:'JetBrains Mono',monospace;word-break:break-word}
.card-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.2rem;margin-top:.3rem;padding-top:.3rem;border-top:1px solid var(--border)}
.card-assignees{display:flex;align-items:center;gap:.2rem;flex-wrap:wrap}
.achip{font-size:.58em;padding:.1rem .38rem;border-radius:8px;background:var(--surface2);color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.uchip{font-size:.58em;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic}
.card-dates{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.card-due{font-size:.58em;font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}
.card-due.overdue{color:#e74c3c}
.card-start{font-size:.58em;font-family:'JetBrains Mono',monospace;color:var(--dim);white-space:nowrap}
.card-deps{font-size:.58em;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:.25rem;margin-top:.25rem;flex-wrap:wrap}
.dep-blocked{color:#e74c3c}
.dep-ok{color:#2ecc71}
.dep-blocks{color:var(--muted)}
.status-pip{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:.3rem;flex-shrink:0}
.pip-todo{background:var(--dim)}.pip-inprogress{background:#3498db}.pip-done{background:#2ecc71}

/* ── CALENDAR ── */
.cal-area{padding:var(--pad)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.cal-month-nav{display:flex;align-items:center;gap:.75rem}
.cal-title{font-size:1.1em;font-weight:800;min-width:180px;text-align:center}
.cal-nav-btn{padding:.35rem .7rem;background:var(--surface);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.7em;cursor:pointer;transition:all .2s}
.cal-nav-btn:hover{background:var(--surface2)}
.cal-today-btn{padding:.35rem .7rem;background:transparent;border:1px solid rgba(52,152,219,.3);border-radius:6px;color:#3498db;font-family:'JetBrains Mono',monospace;font-size:.7em;cursor:pointer;transition:all .2s}
.cal-today-btn:hover{background:rgba(52,152,219,.1)}
.cal-legend{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.cal-legend-item{display:flex;align-items:center;gap:.3rem;font-size:.62em;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-day-hdr{text-align:center;font-size:.6em;font-family:'JetBrains Mono',monospace;color:var(--dim);padding:.4rem .2rem;letter-spacing:.08em}
.cal-cell{min-height:clamp(80px,10vw,130px);background:var(--surface);border-radius:6px;padding:.4rem;border:1px solid var(--border);transition:border-color .15s;display:flex;flex-direction:column;gap:.15rem;overflow:hidden}
.cal-cell.today{border-color:#3498db}
.cal-cell.other-month{opacity:.25;pointer-events:none}
.cal-cell.has-tasks{border-color:var(--border2)}
.cal-date{font-size:.65em;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.15rem;flex-shrink:0}
.cal-date.today-num{color:#3498db;font-weight:700}
.cal-pill{display:block;font-size:.58em;padding:.15rem .4rem;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;margin-bottom:.1rem;transition:opacity .15s;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.cal-pill:hover{opacity:.8}
.cal-pill.done{opacity:.35;text-decoration:line-through}
.cal-pill.blocked-pill{outline:1px solid rgba(231,76,60,.6)}
.cal-more{font-size:.55em;color:var(--dim);font-family:'JetBrains Mono',monospace;cursor:pointer;padding:.1rem .2rem}
.cal-more:hover{color:var(--muted)}
.cal-undated{margin-top:1.25rem;padding:1rem;background:var(--surface);border-radius:10px;border:1px solid var(--border)}
.cal-undated-title{font-size:.65em;letter-spacing:.12em;font-family:'JetBrains Mono',monospace;color:var(--dim);margin-bottom:.6rem}
.cal-undated-grid{display:flex;flex-wrap:wrap;gap:.4rem}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:clamp(1.25rem,3vw,1.75rem);width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:1em;font-weight:700;margin-bottom:1.1rem}
.mfield{margin-bottom:.8rem}
.mfield label{display:block;font-size:.62em;letter-spacing:.12em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem}
.mfield input,.mfield textarea,.mfield select{width:100%;padding:.55rem .75rem;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.82em;outline:none;transition:border-color .2s;resize:vertical}
.mfield input[type=date]{color-scheme:dark}
.mfield input:focus,.mfield textarea:focus,.mfield select:focus{border-color:#3498db}
.mfield select option,.mfield select optgroup{background:var(--surface)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.dep-display{display:flex;flex-direction:column;gap:.3rem;margin-top:.35rem}
.dep-item{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;background:var(--surface2);border-radius:5px;font-size:.72em;font-family:'JetBrains Mono',monospace}
.dep-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-item-status{font-size:.85em;margin-left:.4rem;flex-shrink:0}
.dep-item-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9em;padding:.1rem .3rem;border-radius:3px;flex-shrink:0}
.dep-item-del:hover{color:#e74c3c}
.dep-blocks-list{margin-top:.3rem;font-size:.7em;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.modal-section{font-size:.62em;letter-spacing:.12em;color:var(--dim);font-family:'JetBrains Mono',monospace;margin:.9rem 0 .4rem;padding-top:.6rem;border-top:1px solid var(--border)}
.modal-footer{display:flex;gap:.5rem;margin-top:1.1rem;justify-content:flex-end;flex-wrap:wrap}
.mbtn{padding:.5rem 1rem;border-radius:7px;font-family:'Syne',sans-serif;font-size:.82em;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.mbtn.primary{background:#1d4ed8;color:#e8edf5}.mbtn.primary:hover{background:#1e40af}
.mbtn.secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)}.mbtn.secondary:hover{color:var(--text)}
.mbtn.danger{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}.mbtn.danger:hover{background:rgba(231,76,60,.25)}
.mbtn.small{padding:.35rem .7rem;font-size:.75em}
.member-list{display:flex;flex-direction:column;gap:.4rem;margin-top:.4rem;max-height:180px;overflow-y:auto}
.member-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem .6rem;background:var(--surface2);border-radius:6px;font-size:.75em;font-family:'JetBrains Mono',monospace}
.member-name{color:var(--text);font-weight:500}
.member-id{color:var(--dim);font-size:.85em}
.member-del{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9em;padding:.1rem .3rem;border-radius:3px;transition:color .15s}
.member-del:hover{color:#e74c3c}

/* TOAST */
.toast{position:fixed;bottom:1.25rem;right:1.25rem;z-index:2000;padding:.6rem 1rem;border-radius:8px;font-size:.75em;font-family:'JetBrains Mono',monospace;background:var(--surface);border:1px solid var(--border2);color:var(--text);transform:translateY(2rem);opacity:0;transition:all .3s;pointer-events:none;max-width:calc(100vw - 2.5rem)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(46,204,113,.4);color:#2ecc71}
.toast.error{border-color:rgba(231,76,60,.4);color:#e74c3c}
.toast.info{border-color:rgba(52,152,219,.4);color:#3498db}

@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.ld{animation:pulse 1.2s ease-in-out infinite}.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
.loading{display:flex;align-items:center;justify-content:center;height:300px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8em;letter-spacing:.1em}

/* MILESTONES */
.milestone-bar{background:var(--surface);border-top:1px solid var(--border);padding:.6rem var(--pad);display:flex;gap:.85rem;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.milestone-bar::-webkit-scrollbar{display:none}
.milestone-chip{display:flex;align-items:center;gap:.7rem;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:.5rem .9rem;flex-shrink:0;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.milestone-chip::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(255,255,255,.02));pointer-events:none}
.milestone-chip:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.milestone-chip.urgent{border-color:rgba(231,76,60,.5);background:rgba(231,76,60,.08);box-shadow:0 0 12px rgba(231,76,60,.1)}
.milestone-chip.urgent:hover{box-shadow:0 4px 20px rgba(231,76,60,.25)}
.milestone-chip.soon{border-color:rgba(241,196,15,.45);background:rgba(241,196,15,.07)}
.milestone-chip.ok{border-color:rgba(46,204,113,.35);background:rgba(46,204,113,.05)}
.milestone-chip.past{opacity:.35;filter:grayscale(.5)}
.ms-flag{font-size:.9em;flex-shrink:0}
.ms-info{display:flex;flex-direction:column;gap:.1rem}
.ms-name{font-size:.75em;font-weight:700;color:var(--text);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.ms-date{font-size:.58em;font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}
.ms-clock{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.ms-unit{display:flex;flex-direction:column;align-items:center;gap:.05rem}
.ms-digits{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1em;line-height:1;letter-spacing:-.02em;min-width:1.8em;text-align:center;background:var(--bg);border-radius:4px;padding:.15rem .3rem}
.ms-unit-label{font-size:.45em;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--dim)}
.ms-sep{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.9em;color:var(--dim);align-self:flex-start;margin-top:.1rem}
.urgent .ms-digits{color:#e74c3c}
.urgent .ms-sep{color:rgba(231,76,60,.5)}
.soon .ms-digits{color:#f1c40f}
.soon .ms-sep{color:rgba(241,196,15,.5)}
.ok .ms-digits{color:#2ecc71}
.ok .ms-sep{color:rgba(46,204,113,.4)}
.past .ms-digits{color:var(--dim)}
.ms-add-btn{display:flex;align-items:center;gap:.4rem;background:transparent;border:1px dashed var(--border2);border-radius:10px;padding:.5rem .9rem;flex-shrink:0;cursor:pointer;color:var(--dim);font-size:.68em;font-family:'JetBrains Mono',monospace;transition:all .2s;white-space:nowrap;align-self:center}
.ms-add-btn:hover{border-color:var(--border2);color:var(--muted);background:var(--surface2)}
/* Calendar filter chips */
.cal-filter-bar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.cal-filter-chip{padding:.2rem .6rem;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:.62em;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s;white-space:nowrap}
.cal-filter-chip:hover{color:var(--text)}
.cal-filter-chip.active{color:var(--text)}
/* Calendar milestone pills */
.cal-milestone{display:block;font-size:.58em;padding:.15rem .4rem;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;margin-bottom:.1rem;flex-shrink:0;font-family:'JetBrains Mono',monospace;background:rgba(155,89,182,0.9);border-left:2px solid #9b59b6;font-weight:700}
.cal-milestone:hover{opacity:.85}

/* MEETINGS */
.meeting-attendees{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.meeting-chip{font-size:.65em;padding:.15rem .5rem;border-radius:6px;background:rgba(52,152,219,.15);color:#3498db;font-family:'JetBrains Mono',monospace}

/* FINANCE VIEW */
.finance-area{padding:var(--pad);display:flex;flex-direction:column;gap:1.25rem;max-width:1100px;margin:0 auto}
.finance-section-title{font-size:.65em;letter-spacing:.15em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.5rem}
.budget-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.85rem}
.budget-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;border-left:4px solid}
.budget-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.budget-card-name{font-size:.8em;font-weight:700;display:flex;align-items:center;gap:.4rem}
.budget-card-status{font-size:.65em;font-family:'JetBrains Mono',monospace}
.budget-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:.5rem}

/* NODE BOXES */

.fc-box{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .55rem;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);font-size:.68em;cursor:pointer;white-space:nowrap;max-width:180px;position:relative;transition:all .15s;user-select:none}

<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div><div class="header-wordmark">WARP</div><div class="header-title">Kanban Board</div></div>
      <div class="overall-bar">
        <div class="overall-label">OVERALL</div>
        <div class="overall-track"><div class="overall-fill" id="overall-fill" style="width:0%"></div></div>
        <div class="overall-pct" id="overall-pct">0%</div>
      </div>
    </div>

      <div class="sync-info" id="sync-info">Connecting...</div>

    </div>

  <div class="loading"><span class="ld">●</span>&nbsp;<span class="ld">●</span>&nbsp;<span class="ld">●</span></div>
</div>

  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const BIN_ID  = '69d5d38c36566621a88c9d8c';
const API_KEY = '$2a$10$DbpaQeAX21FZZuIOP3ZUmOdE0RC.hGmsLq.dYzkx/WOHVaS0RtoYG';

const SUBS = [
  { id:'manipulator', label:'Manipulator', color:'#e74c3c' },
  { id:'drivetrain',  label:'Drivetrain Chassis',            color:'#e67e22' },
  { id:'comms',       label:'Teleoperations',                 color:'#3498db' },
  { id:'electrical',  label:'Power Systems & Electronics',    color:'#f1c40f' },
  { id:'science',     label:'Science',     color:'#2ecc71' },
  { id:'automation',  label:'Automation',  color:'#e91e63' },
  { id:'admin',        label:'Admin',        color:'#8e44ad' },
  { id:'marketing',    label:'Marketing',    color:'#16a085' },
];

const STATUSES = [
  { id:'todo',       label:'To Do',       color:'#3a4560' },
  { id:'inprogress', label:'In Progress', color:'#3498db' },
  { id:'done',       label:'Done',        color:'#2ecc71' },
];

const PRI_ORDER  = { high:0, medium:1, low:2, '':3 };
const PRI_LABELS = { high:'HIGH', medium:'MED', low:'LOW' };

let store = {}, activeTab = 'all', refreshTimer = null, financeUnlocked = false, adminUnlocked = false, draggedTaskId = null, draggedTaskGoalId = null;
let dragData = null;
let calMonth = new Date().getMonth();
let calYear  = new Date().getFullYear();
let calFilter = 'all'; // 'all' or a sub id

// ── DATE HELPERS ──
function dmyToYmd(dmy) {
  if (!dmy) return '';
  const p = dmy.split('/');
  if (p.length !== 3) return '';
  return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
}
function ymdToDmy(ymd) {
  if (!ymd) return '';
  const p = ymd.split('-');
  if (p.length !== 3) return '';
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function parseDmy(dmy) {
  if (!dmy) return Infinity;
  const p = dmy.split('/');
  if (p.length !== 3) return Infinity;
  return new Date(p[2], p[1]-1, p[0]).getTime();
}
function todayDmy() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

// ── API ──
async function jbGet() {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { headers: { 'X-Master-Key': API_KEY } });
  if (!r.ok) throw new Error(`JSONBin error ${r.status}`);
  return (await r.json()).record || {};
}
async function jbPut(data) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY, 'X-Bin-Versioning': 'false' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Save error ${r.status}`);
}

async function loadData() {
  const rec = await jbGet();
  store = rec;
  if (!store.tasks)      store.tasks      = {};
  if (!store.members)   store.members   = {};
  if (!store.milestones) store.milestones = [];
  if (!store.meetings)   store.meetings   = [];
  if (!store.goals)     store.goals     = [];
  SUBS.forEach(s => {
    if (!store.tasks[s.id]) store.tasks[s.id] = [];
    store.tasks[s.id].forEach(t => {
      if (!t.status)   t.status   = t.done ? 'done' : 'todo';
      if (!t.priority) t.priority = '';
      if (!t.dependsOn) t.dependsOn = [];
    });
  });
  renderTabs(); renderBoard(); renderMilestoneBar();
  document.getElementById('sync-info').textContent = 'SYNCED ' + new Date().toLocaleTimeString();
}
async function saveData() {
  await jbPut(store);
  document.getElementById('sync-info').textContent = 'SAVED ' + new Date().toLocaleTimeString();
}
function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻ SYNCING...';
  loadData().finally(() => btn.textContent = '↻ REFRESH');
}
function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => loadData().catch(() => {}), 30000);
}
function makeId() { return Math.random().toString(36).slice(2, 10); }

// ── TASK/MEMBER HELPERS ──
function memberName(id) { return store.members?.[id] || ('…' + (id || '').slice(-4)); }

function findTask(taskId) {
  for (const sub of SUBS) {
    const task = (store.tasks[sub.id] || []).find(t => t.id === taskId);
    if (task) return { task, sub };
  }
  return null;
}

function getBlockedBy(task) {
  return (task.dependsOn || []).map(id => findTask(id)).filter(Boolean);
}

function getBlocksFor(taskId) {
  const result = [];
  SUBS.forEach(sub => {
    (store.tasks[sub.id] || []).forEach(t => {
      if ((t.dependsOn || []).includes(taskId)) result.push({ task: t, sub });
    });
  });
  return result;
}

function isBlocked(task) {
  return (task.dependsOn || []).some(id => {
    const found = findTask(id);
    return found && found.task.status !== 'done';
  });
}

// ── SORTING ──
function sortedTasks(tasks) {
  return [...tasks].sort((a, b) => {
    const pa = PRI_ORDER[a.priority || ''] ?? 3;
    const pb = PRI_ORDER[b.priority || ''] ?? 3;
    if (pa !== pb) return pa - pb;
    const da = parseDmy(a.dueDate);
    const db = parseDmy(b.dueDate);
    if (da !== db) return da - db;
    return (a.addedAt || 0) - (b.addedAt || 0);
  });
}

// ── TABS ──
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  const allRem = Object.values(store.tasks).flat().filter(t => t.status !== 'done').length;
  const allTot = Object.values(store.tasks).flat().length;
  bar.appendChild(makeTab('all',      'All',      '#3498db', allRem, allTot));
  bar.appendChild(makeTab('calendar', '📅 Calendar', '#9b59b6', null, null));
  bar.appendChild(makeTab('goals',   '🎯 Goals',   '#e67e22', null, null));
  bar.appendChild(makeTab('finance', '💰 Finance' + (financeUnlocked ? ' 🔓' : ' 🔒'), '#2ecc71', null, null));
  bar.appendChild(makeTab('lead-panel', '🔐 Lead Panel' + (adminUnlocked ? ' 🔓' : ' 🔒'), '#e74c3c', null, null));
  SUBS.forEach(sub => {
    const list = store.tasks[sub.id] || [];
    const rem  = list.filter(t => t.status !== 'done').length;
    bar.appendChild(makeTab(sub.id, sub.label, sub.color, rem, list.length));
  });
}

function makeTab(id, label, color, remaining, total) {
  const tab = document.createElement('button');
  tab.className = 'tab' + (activeTab === id ? ' active' : '');
  tab.style.setProperty('--tab-color', color);
  const badge = remaining > 0 ? `<span class="tab-badge">${remaining}</span>` : '';
  const dot   = (id !== 'calendar' && id !== 'finance' && id !== 'lead-panel') ? `<span class="tab-dot" style="background:${color}"></span>` : '';
  tab.innerHTML = `${dot}${esc(label)}${badge}`;
  tab.onclick = () => { activeTab = id; renderTabs(); renderBoard(); };
  return tab;
}

// ── BOARD ROUTER ──
function renderBoard() {
  const allTasks = Object.values(store.tasks).flat();
  const total    = allTasks.length;
  const done     = allTasks.filter(t => t.status === 'done').length;
  const pct      = total === 0 ? 0 : Math.round(done / total * 100);
  document.getElementById('overall-fill').style.width = pct + '%';
  document.getElementById('overall-pct').textContent  = pct + '%';

  const area = document.getElementById('main-area');
  if      (activeTab === 'all')      renderAllView(area);
  else if (activeTab === 'calendar') renderCalendarView(area);
  else if (activeTab === 'goals')    renderGoalsView(area);
  else if (activeTab === 'finance')  renderFinanceView(area);
  else if (activeTab === 'lead-panel')    renderAdminView(area);
  else                               renderSubView(area, activeTab);
}

// ── ALL VIEW ──
function renderAllView(area) {
  area.className = 'all-grid';
  area.innerHTML = '';
  SUBS.forEach(sub => {
    const list = store.tasks[sub.id] || [];
    const done = list.filter(t => t.status === 'done').length;
    const rem  = list.filter(t => t.status !== 'done');
    const pct  = list.length === 0 ? 0 : Math.round(done / list.length * 100);
    const col  = document.createElement('div');
    col.className = 'mini-col';
    const hdr = document.createElement('div');
    hdr.className = 'mini-header';
    hdr.style.borderLeftColor = sub.color;
    hdr.innerHTML = `<div class="mini-name"><div class="mini-dot" style="background:${sub.color}"></div>${esc(sub.label)}</div><div class="mini-meta">${done}/${list.length}</div>`;
    hdr.onclick = () => { activeTab = sub.id; renderTabs(); renderBoard(); };
    col.appendChild(hdr);
    const prog = document.createElement('div');
    prog.className = 'mini-progress';
    prog.innerHTML = `<div class="col-fill" style="width:${pct}%;background:${sub.color}"></div>`;
    col.appendChild(prog);
    if (list.length === 0)       col.innerHTML += `<div class="col-empty">No tasks</div>`;
    else if (rem.length === 0)   col.innerHTML += `<div class="col-empty" style="color:#2ecc71">All done ✓</div>`;
    else sortedTasks(rem).forEach(task => col.appendChild(buildCard(task, sub, true)));
    const addBtn = document.createElement('button');
    addBtn.className = 'col-add-btn';
    addBtn.textContent = '+ Add task';
    addBtn.onclick = e => { e.stopPropagation(); openAddModal(sub.id); };
    col.appendChild(addBtn);
    area.appendChild(col);
  });
}

// ── SUBSYSTEM VIEW ──
function renderSubView(area, subId) {
  area.className = 'board-area';
  area.innerHTML = '';
  const sub  = SUBS.find(s => s.id === subId);
  const list = store.tasks[subId] || [];

  STATUSES.forEach(status => {
    const tasks = list.filter(t => t.status === status.id);
    const wrap  = document.createElement('div');
    wrap.className = 'col-wrap';

    wrap.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; wrap.classList.add('drag-over'); });
    wrap.addEventListener('dragleave', () => wrap.classList.remove('drag-over'));
    wrap.addEventListener('drop', e => {
      e.preventDefault(); wrap.classList.remove('drag-over');
      if (!dragData) return;
      const task = store.tasks[dragData.subId]?.find(t => t.id === dragData.taskId);
      if (!task) return;
      task.status = status.id; task.done = status.id === 'done';
      renderTabs(); renderBoard();
      saveData().then(() => toast(`→ ${status.label}`, 'success')).catch(() => toast('Save failed', 'error'));
      dragData = null;
    });

    const hdr = document.createElement('div');
    hdr.className = 'col-header';
    hdr.innerHTML = `<div class="col-title"><span class="status-pip pip-${status.id}"></span>${esc(status.label)}</div><span class="col-count-badge">${tasks.length}</span>`;
    wrap.appendChild(hdr);

    if (status.id === 'done') {
      const pct  = list.length === 0 ? 0 : Math.round(tasks.length / list.length * 100);
      const prog = document.createElement('div');
      prog.className = 'col-progress';
      prog.innerHTML = `<div class="col-fill" style="width:${pct}%;background:${sub.color}"></div>`;
      wrap.appendChild(prog);
    }

    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'col-empty';
      empty.textContent = status.id === 'todo' ? 'No tasks yet' : status.id === 'inprogress' ? 'Nothing in progress' : 'Nothing completed';
      wrap.appendChild(empty);
    } else {
      // Group by priority
      const groups = [
        { key:'high',   tasks: tasks.filter(t => t.priority === 'high') },
        { key:'medium', tasks: tasks.filter(t => t.priority === 'medium') },
        { key:'low',    tasks: tasks.filter(t => t.priority === 'low') },
        { key:'',       tasks: tasks.filter(t => !t.priority) },
      ].filter(g => g.tasks.length > 0);

      groups.forEach((group, gi) => {
        if (group.key && groups.length > 1) {
          const ghdr = document.createElement('div');
          ghdr.className = 'pri-group-header';
          const colors = { high:'var(--pri-high)', medium:'var(--pri-medium)', low:'var(--pri-low)' };
          ghdr.innerHTML = `<span style="color:${colors[group.key]||'var(--dim)'}">${PRI_LABELS[group.key]||'NONE'}</span>`;
          if (gi > 0) ghdr.style.marginTop = '.4rem';
          wrap.appendChild(ghdr);
        }
        sortedTasks(group.tasks).forEach(task => wrap.appendChild(buildCard(task, sub, false)));
      });
    }

    if (status.id === 'todo') {
      const addBtn = document.createElement('button');
      addBtn.className = 'col-add-btn';
      addBtn.textContent = '+ Add task';
      addBtn.onclick = e => { e.stopPropagation(); openAddModal(subId); };
      wrap.appendChild(addBtn);
    }
    area.appendChild(wrap);
  });
}

// ── CALENDAR VIEW ──
function renderCalendarView(area) {
  area.className = 'cal-area';
  area.innerHTML = '';

  const firstDay   = new Date(calYear, calMonth, 1);
  const lastDay    = new Date(calYear, calMonth + 1, 0);
  const monthLabel = firstDay.toLocaleString('default', { month: 'long', year: 'numeric' });
  const today      = new Date();
  const todayKey   = todayDmy();

  // Build task map by DD/MM/YYYY key — include due dates, start dates, and check-ins
  const byDate = {};
  const addToDate = (key, entry) => { if (!byDate[key]) byDate[key] = []; byDate[key].push(entry); };
  SUBS.forEach(sub => {
    (store.tasks[sub.id] || []).forEach(task => {
      if (task.dueDate) addToDate(task.dueDate, { task, sub, type: 'due' });
      if (task.startDate && task.startDate !== task.dueDate) addToDate(task.startDate, { task, sub, type: 'start' });
      (task.checkIns || []).forEach(ci => { if (ci.date) addToDate(ci.date, { task, sub, type: 'checkin', ci }); });
    });
  });
  // Add meetings to calendar
  (store.meetings || []).forEach(mt => {
    if (!mt.date) return;
    if (!byDate[mt.date]) byDate[mt.date] = [];
    byDate[mt.date].push({ mt, type: 'meeting' });
  });
  // Add milestones as their own entries
  (store.milestones || []).forEach(ms => {
    if (!byDate[ms.date]) byDate[ms.date] = [];
    byDate[ms.date].unshift({ ms, type: 'milestone' });
  });

  // Undated tasks
  const undated = [];
  SUBS.forEach(sub => {
    (store.tasks[sub.id] || []).filter(t => !t.dueDate && t.status !== 'done').forEach(task => {
      undated.push({ task, sub });
    });
  });

  // Apply subsystem filter to byDate
  if (calFilter !== 'all') {
    Object.keys(byDate).forEach(key => {
      byDate[key] = byDate[key].filter(e => e.type === 'milestone' || e.sub?.id === calFilter);
      if (!byDate[key].length) delete byDate[key];
    });
  }

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'cal-header';
  const filterChips = [
    '<button class="cal-filter-chip' + (calFilter==='all' ? ' active" style="border-color:rgba(52,152,219,.5);color:#3498db"' : '"') + ' onclick="setCalFilter(\'all\')">All</button>',
    ...SUBS.map(s =>
      '<button class="cal-filter-chip' + (calFilter===s.id ? ' active" style="border-color:'+s.color+'55;color:'+s.color+'"' : '"') +
      ' onclick="setCalFilter(\''+s.id+'\')">'+esc(s.label)+'</button>'
    )
  ].join('');
  hdr.innerHTML = `
    <div>
      <div class="cal-month-nav">
        <button class="cal-nav-btn" onclick="calPrev()">←</button>
        <div class="cal-title">${esc(monthLabel)}</div>
        <button class="cal-nav-btn" onclick="calNext()">→</button>
        <button class="cal-today-btn" onclick="calToday()">Today</button>
      </div>
      <div class="cal-filter-bar">${filterChips}</div>
    </div>
    <div class="cal-legend">
      ${SUBS.map(s => `<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${s.color}"></div>${esc(s.label)}</div>`).join('')}
    </div>
  `;
  area.appendChild(hdr);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  ['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach(d => {
    const dh = document.createElement('div');
    dh.className = 'cal-day-hdr';
    dh.textContent = d;
    grid.appendChild(dh);
  });

  // Start padding (Mon=0)
  let startDow = firstDay.getDay();
  startDow = (startDow + 6) % 7;

  // Prev month padding
  for (let i = 0; i < startDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    grid.appendChild(cell);
  }

  // Days of month
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateKey = `${String(d).padStart(2,'0')}/${String(calMonth+1).padStart(2,'0')}/${calYear}`;
    const isToday = dateKey === todayKey;
    const tasks   = byDate[dateKey] || [];

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '') + (tasks.length ? ' has-tasks' : '');

    const dateNum = document.createElement('div');
    dateNum.className = 'cal-date' + (isToday ? ' today-num' : '');
    dateNum.textContent = d;
    cell.appendChild(dateNum);

    const MAX_SHOW = 4;
    tasks.slice(0, MAX_SHOW).forEach(({ task, sub, type, ci, ms, mt }) => {
      const pill = document.createElement('div');
      if (type === 'milestone') {
        pill.className = 'cal-milestone';
        const daysLeft = msDaysLeft(ms.date);
        const suffix = daysLeft === 0 ? ' — TODAY' : daysLeft > 0 ? ` — ${daysLeft}d` : ` — ${Math.abs(daysLeft)}d ago`;
        pill.title = ms.name + (ms.description ? ': ' + ms.description : '');
        pill.textContent = '🏁 ' + ms.name + suffix;
        pill.onclick = () => {
          const idx = (store.milestones||[]).findIndex(m => m.id === ms.id);
          if (idx >= 0) openEditMilestoneModal(idx);
        };
        cell.appendChild(pill);
        return;
      } else if (type === 'meeting') {
        pill.className = 'cal-pill';
        pill.style.background = 'rgba(52,152,219,0.85)';
        pill.style.borderLeft = '2px solid #3498db';
        const attendeeCount = mt.attendees?.length || 0;
        pill.title = mt.title + (mt.time ? ' at ' + mt.time : '') + (attendeeCount ? ' (' + attendeeCount + ' invited)' : '');
        pill.textContent = '📅 ' + mt.title + (mt.time ? ' ' + mt.time : '');
        pill.onclick = () => openEditMeetingModal(mt.id);
        cell.appendChild(pill);
        return;
      } else if (type === 'checkin') {
        pill.className = 'cal-pill';
        pill.style.background = 'rgba(155,89,182,0.8)';
        pill.style.borderLeft = '2px solid #9b59b6';
        pill.title = 'Check-in: ' + task.name + (ci.note ? ' — ' + ci.note : '');
        pill.textContent = '🕐 ' + task.name;
        pill.onclick = () => openEditModal(sub.id, task.id);
      } else if (type === 'start') {
        pill.className = 'cal-pill';
        pill.style.background = sub.color + '55';
        pill.style.border = '1px solid ' + sub.color;
        pill.style.color = '#e8edf5';
        pill.title = '▶ Start: ' + task.name;
        pill.textContent = '▶ ' + task.name;
        pill.onclick = () => openEditModal(sub.id, task.id);
      } else {
        pill.className = 'cal-pill' + (task.status === 'done' ? ' done' : '') + (isBlocked(task) ? ' blocked-pill' : '');
        pill.style.background = sub.color;
        pill.title = task.name + (task.status === 'done' ? ' ✓' : '') + (isBlocked(task) ? ' ⛔ Blocked' : '');
        const icon = task.status === 'done' ? '✓ ' : task.status === 'inprogress' ? '◑ ' : '';
        pill.textContent = icon + task.name;
        pill.onclick = () => openEditModal(sub.id, task.id);
      }
      cell.appendChild(pill);
    });

    if (tasks.length > MAX_SHOW) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = `+${tasks.length - MAX_SHOW} more`;
      more.onclick = () => {
        // Show all tasks for this date in a mini modal
        showDayModal(dateKey, tasks);
      };
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }

  // Trailing padding
  const totalCells = startDow + lastDay.getDate();
  const trailingCells = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailingCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    grid.appendChild(cell);
  }

  area.appendChild(grid);

  // Undated tasks section
  if (undated.length > 0) {
    const ud = document.createElement('div');
    ud.className = 'cal-undated';
    ud.innerHTML = `<div class="cal-undated-title">UNDATED TASKS (${undated.length})</div>`;
    const udGrid = document.createElement('div');
    udGrid.className = 'cal-undated-grid';
    undated.forEach(({ task, sub }) => {
      const pill = document.createElement('div');
      pill.className = 'cal-pill' + (isBlocked(task) ? ' blocked-pill' : '');
      pill.style.background = sub.color;
      pill.style.marginBottom = '0';
      pill.title = `${sub.label}: ${task.name}`;
      pill.textContent = task.name;
      pill.onclick = () => openEditModal(sub.id, task.id);
      udGrid.appendChild(pill);
    });
    ud.appendChild(udGrid);
    area.appendChild(ud);
  }
}

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderBoard(); }
function setCalFilter(f) { calFilter = f; renderBoard(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderBoard(); }
function calToday() { calMonth = new Date().getMonth(); calYear = new Date().getFullYear(); renderBoard(); }

function showDayModal(dateKey, tasks) {
  showModal(`
    <div class="modal-title">📅 ${esc(dateKey)}</div>
    ${tasks.map(({ task, sub }) => `
      <div style="padding:.5rem .75rem;background:var(--surface2);border-radius:7px;margin-bottom:.4rem;cursor:pointer;border-left:3px solid ${sub.color}"
           onclick="closeModal();openEditModal('${sub.id}','${task.id}')">
        <div style="font-size:.8em;font-weight:600;color:var(--text)">${task.status==='done'?'✓ ':task.status==='inprogress'?'◑ ':''}${esc(task.name)}</div>
        <div style="font-size:.65em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:.2rem">${esc(sub.label)}</div>
      </div>`).join('')}
    <div class="modal-footer"><button class="mbtn secondary" onclick="closeModal()">Close</button></div>
  `);
}

// ── CARD ──
function buildCard(task, sub, compact) {
  const card = document.createElement('div');
  const blocked = isBlocked(task);
  card.className = 'card' + (blocked ? ' blocked' : '');
  card.style.borderLeftColor = blocked ? '#e74c3c' : sub.color;
  card.draggable = true;

  card.addEventListener('dragstart', e => { dragData = { subId: sub.id, taskId: task.id }; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  card.addEventListener('click', () => openEditModal(sub.id, task.id));

  const status   = STATUSES.find(s => s.id === task.status) || STATUSES[0];
  const overdue  = isOverdue(task);
  const sc       = task.status === 'done' ? '#2ecc71' : (blocked ? '#e74c3c' : (overdue ? '#e74c3c' : status.color));
  const statusIcon = task.status === 'done' ? '✓' : task.status === 'inprogress' ? '◑' : '';

  const aHtml = (!task.assignees || !task.assignees.length)
    ? `<span class="uchip">unassigned</span>`
    : task.assignees.map(id => `<span class="achip">${esc(memberName(id))}</span>`).join('');

  const dueHtml   = task.dueDate ? `<span class="card-due${overdue ? ' overdue' : ''}">${overdue ? '⚠' : '📅'} ${esc(task.dueDate)}</span>` : '';
  const startHtml = (!compact && task.startDate) ? `<span class="card-start">▶ ${esc(task.startDate)}</span>` : '';
  const noteHtml  = (!compact && task.notes) ? `<div class="card-notes">${esc(task.notes)}</div>` : '';
  const priHtml   = task.priority ? `<span class="card-priority pri-${task.priority}">${PRI_LABELS[task.priority]}</span>` : '';

  // Dependency info
  let depHtml = '';
  if (!compact) {
    const blockedBy = getBlockedBy(task).filter(d => d.task.status !== 'done');
    const blocks    = getBlocksFor(task.id);
    if (blockedBy.length > 0) {
      depHtml += `<div class="card-deps"><span class="dep-blocked">⛔ Blocked by ${blockedBy.length} task${blockedBy.length>1?'s':''}</span></div>`;
    } else if ((task.dependsOn||[]).length > 0) {
      depHtml += `<div class="card-deps"><span class="dep-ok">✅ All deps complete</span></div>`;
    }
    if (blocks.length > 0) {
      depHtml += `<div class="card-deps"><span class="dep-blocks">⛓ Blocks ${blocks.length} task${blocks.length>1?'s':''}</span></div>`;
    }
  } else if (blocked) {
    depHtml = `<div class="card-deps"><span class="dep-blocked" style="font-size:.58em;font-family:'JetBrains Mono',monospace">⛔ Blocked</span></div>`;
  }

  card.innerHTML = `
    <div class="card-top">
      <div class="card-status" style="border-color:${sc};color:${sc}" title="Click to advance status">${statusIcon}</div>
      <div class="card-name">${esc(task.name)}</div>
      ${priHtml}
    </div>
    ${noteHtml}
    ${depHtml}
    <div class="card-footer">
      <div class="card-assignees">${aHtml}</div>
      <div class="card-dates">${startHtml}${dueHtml}</div>
    </div>
  `;

  card.querySelector('.card-status').addEventListener('click', e => {
    e.stopPropagation();
    cycleStatus(sub.id, task.id);
  });

  return card;
}

// ── UTILS ──
function isOverdue(t) {
  if (!t.dueDate || t.status === 'done') return false;
  const p = t.dueDate.split('/');
  if (p.length !== 3) return false;
  return new Date(p[2], p[1]-1, p[0]) < new Date();
}

// ── TASK ACTIONS ──
async function cycleStatus(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  const order = ['todo','inprogress','done'];
  const cur   = order.indexOf(task.status || 'todo');
  task.status = order[(cur + 1) % order.length];
  task.done   = task.status === 'done';
  renderTabs(); renderBoard();
  try {
    await saveData();
    const label = { todo:'To Do', inprogress:'In Progress', done:'Done' }[task.status];
    toast(`→ ${label}`, 'success');
    // Check if completing this task unblocks anything
    if (task.status === 'done') checkUnblocked(taskId);
  } catch { toast('Save failed', 'error'); }
}

function checkUnblocked(completedTaskId) {
  SUBS.forEach(sub => {
    (store.tasks[sub.id] || []).forEach(t => {
      if (t.status === 'done') return;
      if (!(t.dependsOn || []).includes(completedTaskId)) return;
      const allDone = (t.dependsOn || []).every(id => {
        const found = findTask(id);
        return !found || found.task.status === 'done';
      });
      if (allDone) toast(`🔓 "${t.name.slice(0,30)}" is now unblocked!`, 'info');
    });
  });
}

async function deleteTask(subId, taskId) {
  if (!confirm('Delete this task?')) return;
  // Remove this task from other tasks' dependencies
  SUBS.forEach(s => {
    (store.tasks[s.id] || []).forEach(t => {
      t.dependsOn = (t.dependsOn || []).filter(id => id !== taskId);
    });
  });
  store.tasks[subId] = store.tasks[subId].filter(t => t.id !== taskId);
  closeModal(); renderTabs(); renderBoard();
  try { await saveData(); toast('Task removed', 'success'); }
  catch { toast('Save failed', 'error'); }
}

// ── DEPENDENCY SELECT ──
function depOptions(excludeSubId, excludeTaskId) {
  let html = '';
  SUBS.forEach(sub => {
    const tasks = (store.tasks[sub.id] || []).filter(t => !(t.id === excludeTaskId && sub.id === excludeSubId));
    if (!tasks.length) return;
    html += `<optgroup label="${esc(sub.label)}">`;
    tasks.forEach(t => {
      const icon = t.status === 'done' ? '✅' : t.status === 'inprogress' ? '◑' : '⬜';
      html += `<option value="${esc(t.id)}">${icon} ${esc(t.name)}</option>`;
    });
    html += '</optgroup>';
  });
  return html || '<option disabled>No other tasks yet</option>';
}

function buildDepDisplay(dependsOn, subId, taskId) {
  if (!dependsOn || !dependsOn.length) return '<div style="font-size:.72em;color:var(--dim);font-family:\'JetBrains Mono\',monospace">No dependencies</div>';
  return dependsOn.map(id => {
    const found = findTask(id);
    if (!found) return '';
    const icon = found.task.status === 'done' ? '✅' : found.task.status === 'inprogress' ? '◑' : '⬜';
    return `<div class="dep-item">
      <span class="dep-item-status">${icon}</span>
      <span class="dep-item-name">${esc(found.sub.label)}: ${esc(found.task.name)}</span>
      <button class="dep-item-del" onclick="removeDep('${subId}','${taskId}','${id}')" title="Remove">✕</button>
    </div>`;
  }).filter(Boolean).join('');
}

async function removeDep(subId, taskId, depId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  task.dependsOn = (task.dependsOn || []).filter(id => id !== depId);
  // Re-render modal in place
  openEditModal(subId, taskId);
  try { await saveData(); } catch {}
}

async function addDepFromModal(subId, taskId) {
  const sel = document.getElementById('dep-select');
  if (!sel || !sel.value) return;
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  if (!task.dependsOn) task.dependsOn = [];
  if (!task.dependsOn.includes(sel.value)) {
    task.dependsOn.push(sel.value);
    openEditModal(subId, taskId);
    try { await saveData(); } catch {}
  }
}

// ── MODALS ──
function memberCheckboxList(selected = []) {
  const members = store.members || {};
  if (!Object.keys(members).length) {
    return '<div style="font-size:.72em;color:var(--dim);font-family:JetBrains Mono,monospace;padding:.5rem 0">No members added yet — use the Members button</div>';
  }
  return Object.entries(members).map(([id, name]) =>
    '<label style="display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem;border-radius:6px;cursor:pointer">' +
    '<input type="checkbox" class="m-assign-cb" value="' + esc(id) + '" ' + (selected.includes(id) ? 'checked' : '') + ' style="width:14px;height:14px;accent-color:#3498db;flex-shrink:0;cursor:pointer">' +
    '<span style="font-size:.78em;font-family:JetBrains Mono,monospace;color:var(--text)">' + esc(name) + '</span></label>'
  ).join('');
}
function filterMembers() {
  const q = (document.getElementById('m-assign-search')?.value || '').toLowerCase();
  document.querySelectorAll('#m-assign-list label').forEach(label => {
    const name = label.querySelector('span')?.textContent.toLowerCase() || '';
    label.style.display = name.includes(q) ? '' : 'none';
  });
}

function getCheckedMembers() {
  return [...document.querySelectorAll('.m-assign-cb:checked')].map(cb => cb.value);
}

function openAddModal(subId) {
  const sub = SUBS.find(s => s.id === subId);
  showModal(`
    <div class="modal-title">➕ Add task — ${esc(sub.label)}</div>
    <div class="mfield"><label>TASK NAME</label><input type="text" id="m-name" placeholder="e.g. Assemble wheel mounts" maxlength="100" autofocus></div>
    <div class="mrow">
      <div class="mfield"><label>PRIORITY</label>
        <select id="m-priority"><option value="">None</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      </div>
      <div class="mfield"><label>STATUS</label>
        <select id="m-status"><option value="todo">To Do</option><option value="inprogress">In Progress</option><option value="done">Done</option></select>
      </div>
    </div>

  }

async function addCheckIn(subId, taskId) {
  const date = ymdToDmy(document.getElementById('ci-date').value);
  if (!date) { alert('Please select a date.'); return; }
  const note = document.getElementById('ci-note').value.trim();
  const task = store.tasks[subId]?.find(t => t.id === taskId);

  if (!task.checkIns) task.checkIns = [];

async function removeCheckIn(subId, taskId, index) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task || !task.checkIns) return;
  task.checkIns.splice(index, 1);
  document.getElementById('checkin-list').innerHTML = buildCheckInDisplay(task, subId, taskId);
  try { await saveData(); toast('Check-in removed', 'success'); }
  catch { toast('Save failed', 'error'); }

// ── GOALS ──

function getAllTasks() {
  const all = [];
  for (const sub of SUBS) for (const t of store.tasks[sub.id]||[]) all.push({...t,subId:sub.id,subLabel:sub.label,subColor:sub.color});
  return all;
}
function makeNodeId() { return 'n'+Math.random().toString(36).slice(2,8); }
function treeTaskIds(nodes=[]) {
  const ids=[];
  for(const n of nodes){ if(n.type==='task')ids.push(n.taskId); ids.push(...treeTaskIds(n.children||[])); }
  return ids;
}
function removeNodeFromTree(nodes,nodeId) {
  for(let i=nodes.length-1;i>=0;i--){
    if(nodes[i].nodeId===nodeId){nodes.splice(i,1);return true;}
    if(removeNodeFromTree(nodes[i].children||[],nodeId))return true;
  } return false;
}
function insertNodeInTree(nodes,parentId,node) {
  if(!parentId){nodes.push(node);return true;}
  for(const n of nodes){
    if(n.nodeId===parentId){if(!n.children)n.children=[];n.children.push(node);return true;}
    if(insertNodeInTree(n.children||[],parentId,node))return true;
  } return false;
}
function findNode(nodes,nodeId) {
  for(const n of nodes){if(n.nodeId===nodeId)return n;const f=findNode(n.children||[],nodeId);if(f)return f;} return null;
}
function goalProgress(goal) {
  const at=getAllTasks(),ids=treeTaskIds(goal.tree||[]);
  const linked=ids.map(id=>at.find(t=>t.id===id)).filter(Boolean);
  const done=linked.filter(t=>t.status==='done').length;
  return{done,total:linked.length,pct:linked.length?Math.round(done/linked.length*100):0};
}
function subProgress(node,allTasks) {
  const ids=treeTaskIds(node.children||[]);
  const linked=ids.map(id=>allTasks.find(t=>t.id===id)).filter(Boolean);
  const done=linked.filter(t=>t.status==='done').length;
  return{done,total:linked.length,pct:linked.length?Math.round(done/linked.length*100):0};
}

let fcDragNodeId=null,fcDragGoalId=null,fcDragTaskIds=[],sbSelected=new Set();
const fcState={};  // per-goal: {scale,panX,panY}

function getFcState(goalId) {
  if(!fcState[goalId]) fcState[goalId]={scale:0.9,panX:60,panY:60};
  return fcState[goalId];
}

function applyFcTransform(canvas,goalId) {
  const s=getFcState(goalId);
  canvas.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.scale})`;
}

    sb.appendChild(sbHdr);

        const pri=task.priority==='high'?'🔴':task.priority==='medium'?'🟡':task.priority==='low'?'🟢':'';
        const checked=sbSelected.has(task.id)?'checked':'';

// Build children: horizontal for subgoals, vertical for tasks
function buildFcChildren(nodes,goal,allTasks,canvas,s,isRoot=false) {
  const subgoals=nodes.filter(n=>n.type==='subgoal');
  const tasks=nodes.filter(n=>n.type==='task').filter(n=>{ const t=allTasks.find(x=>x.id===n.taskId); return !t || t.status!=='done'; });
  const wrap=document.createElement('div'); wrap.className='fc-col';

  // Subgoals horizontal — with connectors
  if(subgoals.length) {
    const row=document.createElement('div'); row.className='fc-h-row';
    subgoals.forEach(node=>{
      const branch=document.createElement('div');
      branch.className=subgoals.length===1?'fc-branch-solo':'fc-branch';
      branch.appendChild(buildFcSubgoalNode(node,goal,allTasks,canvas,s));
      row.appendChild(branch);
    });
    wrap.appendChild(row);
  }
  // Tasks vertical — no horizontal connectors, just vertical line
  if(tasks.length) {
    const vstack=document.createElement('div'); vstack.className='fc-v-stack';
    tasks.forEach((node,i)=>{
      const item=document.createElement('div'); item.className='fc-v-item';
      item.appendChild(buildFcTaskNode(node,goal,allTasks,canvas,s));
      vstack.appendChild(item);
    });
    wrap.appendChild(vstack);
  }
  return wrap;
}

function buildFcTaskNode(node,goal,allTasks,canvas,s) {
  const task=allTasks.find(t=>t.id===node.taskId);
  if(!task){const d=document.createElement('div');return d;}
  const sub=SUBS.find(ss=>ss.id===task.subId);
  const sc=task.status==='done'?'done':task.status==='inprogress'?'inprogress':'';
  const pri=task.priority==='high'?'🔴':task.priority==='medium'?'🟡':task.priority==='low'?'🟢':'';
  const icon=task.status==='done'?'✅':task.status==='inprogress'?'◑':'–';
  // Check if this task appears multiple times in the tree
  const allPlaced=treeTaskIds(goal.tree||[]);
  const isLinked=allPlaced.filter(id=>id===node.taskId).length>1;

  const wrap=document.createElement('div'); wrap.className='fc-col';
  const box=document.createElement('div');
  box.className='fc-box '+sc+(isLinked?' fc-linked':'');
  box.style.borderLeftColor=sub?.color||'var(--border2)';
  box.draggable=true; box.dataset.nodeId=node.nodeId; box.dataset.goalId=goal.id;
  box.dataset.taskId=node.taskId;
  box.innerHTML='<span style="color:var(--dim);cursor:grab;font-size:.8em">⠿</span>'+
    (isLinked?'<span title="This task appears in multiple places" style="color:#9b59b6;font-size:.8em;flex-shrink:0">🔗</span>':'')+
    '<span style="color:var(--muted)">'+icon+'</span>'+
    '<span style="overflow:hidden;text-overflow:ellipsis;max-width:120px">'+esc(task.name)+'</span>'+
    (pri?'<span>'+pri+'</span>':'')+
    '<span class="fc-remove" data-gid="'+goal.id+'" data-nid="'+node.nodeId+'" onclick="event.stopPropagation();removeFromTree(this.dataset.gid,this.dataset.nid)">✕</span>';
  box.onclick=()=>openEditModal(task.subId,task.id);

  // Highlight all instances on hover
  if(isLinked) {
    box.addEventListener('mouseenter',()=>{
      document.querySelectorAll('.fc-box[data-task-id="'+node.taskId+'"]').forEach(el=>el.classList.add('fc-linked-hover'));
    });
    box.addEventListener('mouseleave',()=>{
      document.querySelectorAll('.fc-box[data-task-id="'+node.taskId+'"]').forEach(el=>el.classList.remove('fc-linked-hover'));
    });
  }

  setupFcDrag(box,node.nodeId,goal,canvas,s);
  setupFcDZ(box,node.nodeId,goal,canvas,s);
  wrap.appendChild(box);

  if((node.children||[]).length){
    const ch=buildFcChildren(node.children,goal,allTasks,canvas,s);
    wrap.appendChild(ch);
  }
  return wrap;
}

function buildFcSubgoalNode(node,goal,allTasks,canvas,s) {
  const{done,total,pct}=subProgress(node,allTasks);
  const dl=node.deadline?Math.round((parseDmy(node.deadline)-Date.now())/86400000):null;
  const dlCol=dl===null?'var(--muted)':dl<0?'#e74c3c':dl<=7?'#f1c40f':'#2ecc71';
  const fill=pct===100?'#2ecc71':pct>50?'#3498db':'#f1c40f';

  const wrap=document.createElement('div'); wrap.className='fc-col';
  const box=document.createElement('div'); box.className='fc-subgoal';
  box.draggable=true; box.dataset.nodeId=node.nodeId; box.dataset.goalId=goal.id;
  box.innerHTML='<div style="display:flex;align-items:center;gap:.35rem;width:100%">'+
    '<span style="cursor:grab;color:rgba(230,126,34,.5);font-size:.8em">⠿</span>'+
    '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">📌 '+esc(node.name)+'</span>'+
    '<span class="fc-remove" data-gid="'+goal.id+'" data-nid="'+node.nodeId+'" onclick="event.stopPropagation();removeFromTree(this.dataset.gid,this.dataset.nid)" style="margin-left:auto">✕</span>'+
    '</div>'+
    (node.deadline?'<div style="font-size:.58em;font-family:JetBrains Mono,monospace;color:'+dlCol+';margin-top:.1rem">📅 '+esc(node.deadline)+'</div>':'')+
    '<div style="display:flex;align-items:center;gap:.35rem;margin-top:.3rem">'+
      '<div style="flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;min-width:50px"><div style="height:100%;width:'+pct+'%;background:'+fill+';border-radius:2px;transition:width .4s"></div></div>'+
      '<span style="font-size:.6em;font-family:JetBrains Mono,monospace;color:var(--muted);flex-shrink:0">'+done+'/'+total+'</span>'+
    '</div>';
  box.onclick=()=>openEditSubgoalModal(node,goal.id);
  setupFcDrag(box,node.nodeId,goal,canvas,s);
  setupFcDZ(box,node.nodeId,goal,canvas,s);
  wrap.appendChild(box);

  const dropInside=document.createElement('div'); dropInside.className='fc-drop-inside';
  dropInside.textContent='+ Drop inside';
  setupFcDZ(dropInside,node.nodeId,goal,canvas,s);
  wrap.appendChild(dropInside);

  if((node.children||[]).length){
    const ch=buildFcChildren(node.children,goal,allTasks,canvas,s);
    wrap.appendChild(ch);
  }
  return wrap;
}

function setupFcDrag(el,nodeId,goal,canvas,s) {
  el.addEventListener('dragstart',e=>{
    fcDragNodeId=nodeId; fcDragGoalId=goal.id; fcDragTaskIds=[];
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>el.classList.add('dragging'),0);
  });
  el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); document.querySelectorAll('.fc-drag-over').forEach(x=>x.classList.remove('fc-drag-over')); });
}

function setupFcDZ(el,parentNodeId,goal,canvas,s) {
  el.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('fc-drag-over'); });
  el.addEventListener('dragleave',()=>{ el.classList.remove('fc-drag-over'); });
  el.addEventListener('drop',async e=>{
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('fc-drag-over');
    document.querySelectorAll('.fc-drag-over').forEach(x=>x.classList.remove('fc-drag-over'));
    const isSidebar=e.dataTransfer.getData('isSidebar')==='1';
    if(!goal.tree)goal.tree=[];
    if(isSidebar && fcDragGoalId===goal.id) {
      const placed=new Set(treeTaskIds(goal.tree));
      for(const taskId of fcDragTaskIds){
        if(!placed.has(taskId)) insertNodeInTree(goal.tree,parentNodeId,{nodeId:makeNodeId(),type:'task',taskId,children:[]});
      }
      sbSelected.clear();
      renderBoard();
      try{await saveData();toast(fcDragTaskIds.length+' task(s) added','success');}catch{toast('Save failed','error');}
    } else if(fcDragNodeId && fcDragGoalId===goal.id && fcDragNodeId!==parentNodeId) {
      const node=findNode(goal.tree,fcDragNodeId);
      if(!node)return;
      if(parentNodeId && findNode(node.children||[],parentNodeId)){toast('Cannot nest parent inside child','error');return;}
      if(node.type==='task') {
        // Tasks always LINK (copy) — same task can appear multiple places
        insertNodeInTree(goal.tree,parentNodeId,{nodeId:makeNodeId(),type:'task',taskId:node.taskId,children:[]});
        renderBoard();
        try{await saveData();toast('Task linked here ✓ (original kept)','success');}catch{toast('Save failed','error');}
      } else {
        // Subgoals MOVE
        removeNodeFromTree(goal.tree,fcDragNodeId);
        insertNodeInTree(goal.tree,parentNodeId,node);
        renderBoard();
        try{await saveData();toast('Moved','success');}catch{toast('Save failed','error');}
      }
    }
  });
}

async function removeFromTree(goalId,nodeId) {
  const goal=(store.goals||[]).find(g=>g.id===goalId);
  if(!goal)return;
  removeNodeFromTree(goal.tree,nodeId);
  renderBoard();
  try{await saveData();toast('Removed','success');}catch{}
}

function toggleAllSb(e,goalId) {
  const at=getAllTasks(),goal=(store.goals||[]).find(g=>g.id===goalId);
  if(!goal)return;
  const placed=new Set(treeTaskIds(goal.tree||[]));
  const unplaced=at.filter(t=>!placed.has(t.id));
  if(sbSelected.size>0){sbSelected.clear();e.target.textContent='☐ All';}
  else{unplaced.forEach(t=>sbSelected.add(t.id));e.target.textContent='☑ All';}
  renderBoard();
}

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  const monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });

  const remindersByDate = {};
  reminders.forEach(r => { if (!remindersByDate[r.date]) remindersByDate[r.date] = []; remindersByDate[r.date].push(r); });

  let calHtml = '<div style="font-size:.72em;font-weight:700;margin-bottom:.4rem;color:var(--text)">' + monthName + '</div>';
  calHtml += '<div class="admin-cal-grid">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => { calHtml += '<div class="admin-cal-day-hdr">' + d + '</div>'; });
  for (let i = 0; i < firstDay; i++) calHtml += '<div class="admin-cal-cell" style="background:transparent;border-color:transparent"></div>';
  for (let d = 1; d <= lastDate; d++) {
    const dmy = String(d).padStart(2,'0') + '/' + String(calMonth+1).padStart(2,'0') + '/' + calYear;
    const isToday = d === now.getDate();
    const hasRem = remindersByDate[dmy]?.length > 0;
    calHtml += '<div class="admin-cal-cell' + (isToday ? ' today' : '') + (hasRem ? ' has-reminder' : '') + '">';
    calHtml += '<div class="admin-cal-date">' + d + '</div>';
    if (hasRem) remindersByDate[dmy].forEach(r => { calHtml += '<div class="admin-cal-chip" data-rid="' + r.id + '" onclick="openEditReminderModal(this.dataset.rid)">' + esc(r.title) + '</div>'; });
    calHtml += '</div>';
  }
  calHtml += '</div>';
  remBody.innerHTML = calHtml;

  // Reminder list
  if (reminders.length) {
    const listDiv = document.createElement('div');
    listDiv.style.marginTop = '.75rem';
    const sorted = [...reminders].sort((a,b) => parseDmy(a.date) - parseDmy(b.date));
    sorted.forEach(r => {
      const row = document.createElement('div');
      row.className = 'admin-reminder-row';
      const daysLeft = Math.round((parseDmy(r.date) - Date.now()) / 86400000);
      const when = daysLeft < 0 ? 'Past' : daysLeft === 0 ? 'Today' : 'in ' + daysLeft + 'd';
      const color = daysLeft < 0 ? 'var(--dim)' : daysLeft <= 2 ? '#e74c3c' : '#f1c40f';
      row.innerHTML =
        '<div style="font-size:.78em;color:var(--text)">' + esc(r.title) + (r.repeat ? ' <span style="color:var(--muted);font-size:.85em">↺ ' + esc(r.repeat) + '</span>' : '') + '</div>' +
        '<div style="font-family:JetBrains Mono,monospace;font-size:.68em;color:var(--muted)">' + esc(r.date) + (r.time ? ' ' + esc(r.time) : '') + '</div>' +
        '<div style="font-family:JetBrains Mono,monospace;font-size:.68em;color:' + color + '">' + when + '</div>' +
        '<button data-rid="' + r.id + '" onclick="openEditReminderModal(this.dataset.rid)" style="padding:.2rem .5rem;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-size:.65em;font-family:JetBrains Mono,monospace;cursor:pointer">✎</button>';
      listDiv.appendChild(row);
    });
    remBody.appendChild(listDiv);
  } else {
    remBody.innerHTML += '<div style="font-size:.7em;color:var(--dim);font-family:JetBrains Mono,monospace;margin-top:.75rem">No reminders yet — click + Add to create one</div>';
  }

  remSec.appendChild(remBody);
  area.appendChild(remSec);
}

async function sendNudge(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  const sub  = SUBS.find(s => s.id === subId);
  if (!task) return;
  const msg = document.getElementById('nudge-msg').value.trim();
  // Save nudge request to JSONBin — bot picks it up and posts in lead channel
  if (!store.pendingNudges) store.pendingNudges = [];
  store.pendingNudges.push({
    id: makeId(),
    subId,
    taskId,
    taskName: task.name,
    message: msg || null,
    sentAt: Date.now()
  });
  closeModal();
  try {
    await saveData();
    toast('Nudge sent to ' + sub.label + ' lead channel!', 'success');

}
