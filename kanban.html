<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URT Rover — Kanban</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c14;--surface:#0e1521;--surface2:#141d2e;--surface3:#1a2438;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8edf5;--muted:#6b7a96;--dim:#3a4560}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{position:sticky;top:0;z-index:200;background:rgba(8,12,20,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-top{padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.header-left{display:flex;align-items:center;gap:1.25rem}
.header-wordmark{font-size:.6rem;letter-spacing:.2em;color:var(--muted);font-family:'JetBrains Mono',monospace}
.header-title{font-size:1rem;font-weight:800}
.overall-bar{display:flex;align-items:center;gap:.6rem}
.overall-label{font-size:.6rem;letter-spacing:.1em;color:var(--muted);font-family:'JetBrains Mono',monospace}
.overall-track{width:100px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
.overall-fill{height:100%;background:linear-gradient(90deg,#1d4ed8,#3498db);border-radius:2px;transition:width .8s ease}
.overall-pct{font-size:.72rem;font-weight:600;font-family:'JetBrains Mono',monospace;color:#3498db;min-width:30px}
.header-right{display:flex;align-items:center;gap:.6rem}
.sync-info{font-size:.6rem;color:var(--dim);font-family:'JetBrains Mono',monospace}
.hbtn{padding:.4rem .8rem;background:transparent;border:1px solid var(--border2);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.08em;cursor:pointer;transition:all .2s}
.hbtn.blue{color:#3498db;border-color:rgba(52,152,219,.3)}.hbtn.blue:hover{background:rgba(52,152,219,.1);border-color:#3498db}

/* SUBSYSTEM TABS */
.tab-bar{display:flex;align-items:stretch;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 1.5rem}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-bar::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
.tab{padding:.65rem 1.1rem;font-size:.72rem;font-weight:600;letter-spacing:.04em;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:.5rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--tab-color,#3498db)}
.tab-dot{width:7px;height:7px;border-radius:50%;background:var(--tab-color,#3498db);flex-shrink:0}
.tab-badge{font-size:.58rem;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--muted);padding:.1rem .4rem;border-radius:10px}

/* BOARD */
.board-area{padding:1.25rem 1.5rem 2rem;display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;min-height:calc(100vh - 120px)}

/* COLUMN */
.col-wrap{display:flex;flex-direction:column;gap:.5rem}
.col-header{padding:.55rem .75rem;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-bottom:.1rem}
.col-title{font-size:.72rem;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:.5rem}
.col-icon{font-size:.8rem}
.col-count-badge{font-size:.6rem;font-family:'JetBrains Mono',monospace;background:var(--surface2);color:var(--muted);padding:.1rem .45rem;border-radius:10px}
.col-progress{height:2px;background:var(--surface2);border-radius:1px;overflow:hidden;margin-bottom:.4rem}
.col-fill{height:100%;border-radius:1px;transition:width .6s ease}
.col-empty{padding:1.5rem;text-align:center;color:var(--dim);font-size:.7rem;font-family:'JetBrains Mono',monospace;border:1px dashed var(--border);border-radius:8px}
.col-add-btn{width:100%;padding:.5rem;background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--dim);font-size:.68rem;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s;letter-spacing:.05em}
.col-add-btn:hover{border-color:var(--border2);color:var(--muted);background:var(--surface)}

/* ALL TAB — 6 mini subsystem cols */
.all-grid{padding:1.25rem 1.5rem 2rem;display:grid;grid-template-columns:repeat(6,1fr);gap:.85rem;min-height:calc(100vh - 120px)}
@media(max-width:1200px){.all-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.all-grid{grid-template-columns:repeat(2,1fr)}}
.mini-col{display:flex;flex-direction:column;gap:.4rem}
.mini-header{padding:.5rem .65rem;border-radius:8px;border-left:3px solid;background:var(--surface);display:flex;align-items:center;justify-content:space-between;margin-bottom:.2rem}
.mini-name{font-size:.7rem;font-weight:600;display:flex;align-items:center;gap:.35rem}
.mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mini-meta{font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.mini-progress{height:2px;background:var(--surface2);border-radius:1px;overflow:hidden;margin-bottom:.35rem}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.65rem;border-left:3px solid;transition:border-color .2s,transform .15s}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;gap:.4rem;margin-bottom:.4rem}
.card-status{width:13px;height:13px;border-radius:50%;border:1.5px solid;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;transition:all .2s}
.card-status:hover{transform:scale(1.15)}
.card-name{font-size:.75rem;font-weight:600;line-height:1.4;flex:1;color:var(--text)}
.card-actions{display:flex;gap:.2rem;opacity:0;transition:opacity .15s}
.card:hover .card-actions{opacity:1}
.card-btn{width:16px;height:16px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.card-btn:hover{background:var(--surface3);color:var(--text)}
.card-btn.danger:hover{background:rgba(231,76,60,.15);color:#e74c3c;border-color:rgba(231,76,60,.3)}
.card-notes{font-size:.65rem;color:var(--muted);line-height:1.5;margin-bottom:.4rem;font-family:'JetBrains Mono',monospace}
.card-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.25rem;margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--border)}
.achip{font-size:.56rem;padding:.1rem .4rem;border-radius:8px;background:var(--surface2);color:var(--muted);font-family:'JetBrains Mono',monospace}
.uchip{font-size:.56rem;color:var(--dim);font-family:'JetBrains Mono',monospace;font-style:italic}
.card-due{font-size:.56rem;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.card-due.overdue{color:#e74c3c}
.status-pip{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:.3rem;flex-shrink:0}

/* STATUS COLORS */
.pip-todo{background:var(--dim)}
.pip-inprogress{background:#3498db}
.pip-done{background:#2ecc71}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:1.75rem;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:1.2rem}
.mfield{margin-bottom:.85rem}
.mfield label{display:block;font-size:.62rem;letter-spacing:.12em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.35rem}
.mfield input,.mfield textarea,.mfield select{width:100%;padding:.6rem .8rem;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.8rem;outline:none;transition:border-color .2s;resize:vertical}
.mfield input:focus,.mfield textarea:focus,.mfield select:focus{border-color:#3498db}
.mfield select option{background:var(--surface)}
.modal-footer{display:flex;gap:.6rem;margin-top:1.2rem;justify-content:flex-end}
.mbtn{padding:.55rem 1.1rem;border-radius:7px;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.mbtn.primary{background:#1d4ed8;color:#e8edf5}.mbtn.primary:hover{background:#1e40af}
.mbtn.secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)}.mbtn.secondary:hover{color:var(--text)}
.mbtn.danger{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}.mbtn.danger:hover{background:rgba(231,76,60,.25)}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:2000;padding:.65rem 1.1rem;border-radius:8px;font-size:.75rem;font-family:'JetBrains Mono',monospace;background:var(--surface);border:1px solid var(--border2);color:var(--text);transform:translateY(2rem);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(46,204,113,.4);color:#2ecc71}
.toast.error{border-color:rgba(231,76,60,.4);color:#e74c3c}

@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.ld{animation:pulse 1.2s ease-in-out infinite}.ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
.loading{display:flex;align-items:center;justify-content:center;height:300px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.1em}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div><div class="header-wordmark">URT ROVER TEAM</div><div class="header-title">Kanban Board</div></div>
      <div class="overall-bar">
        <div class="overall-label">OVERALL</div>
        <div class="overall-track"><div class="overall-fill" id="overall-fill" style="width:0%"></div></div>
        <div class="overall-pct" id="overall-pct">0%</div>
      </div>
    </div>
    <div class="header-right">
      <div class="sync-info" id="sync-info">Connecting...</div>
      <button class="hbtn blue" id="refresh-btn" onclick="refresh()">↻ REFRESH</button>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
</div>

<div id="main-area">
  <div class="loading"><span class="ld">●</span>&nbsp;<span class="ld">●</span>&nbsp;<span class="ld">●</span></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const BIN_ID  = '69d5d38c36566621a88c9d8c';
const API_KEY = '$2a$10$DbpaQeAX21FZZuIOP3ZUmOdE0RC.hGmsLq.dYzkx/WOHVaS0RtoYG';

const SUBS = [
  { id:'manipulator', label:'Manipulator', color:'#e74c3c' },
  { id:'drivetrain',  label:'Drivetrain',  color:'#e67e22' },
  { id:'comms',       label:'Comms',       color:'#3498db' },
  { id:'electrical',  label:'Electrical',  color:'#f1c40f' },
  { id:'science',     label:'Science',     color:'#2ecc71' },
  { id:'automation',  label:'Automation',  color:'#e91e63' },
];

const STATUSES = [
  { id:'todo',       label:'To Do',       icon:'○', color:'#3a4560' },
  { id:'inprogress', label:'In Progress', icon:'◑', color:'#3498db' },
  { id:'done',       label:'Done',        icon:'●', color:'#2ecc71' },
];

let store = {}, activeTab = 'all', refreshTimer = null;

// ── API ──
async function jbGet() {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { headers: { 'X-Master-Key': API_KEY } });
  if (!r.ok) throw new Error(`JSONBin error ${r.status}`);
  return (await r.json()).record || {};
}

async function jbPut(data) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY, 'X-Bin-Versioning': 'false' },
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(`Save error ${r.status}`);
}

async function loadData() {
  const rec = await jbGet();
  store = rec;
  if (!store.tasks) store.tasks = {};
  SUBS.forEach(s => {
    if (!store.tasks[s.id]) store.tasks[s.id] = [];
    // Migrate old tasks: if no status field, set based on done
    store.tasks[s.id].forEach(t => {
      if (!t.status) t.status = t.done ? 'done' : 'todo';
    });
  });
  renderTabs();
  renderBoard();
  document.getElementById('sync-info').textContent = 'SYNCED ' + new Date().toLocaleTimeString();
}

async function saveData() {
  await jbPut(store);
  document.getElementById('sync-info').textContent = 'SAVED ' + new Date().toLocaleTimeString();
}

function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.textContent = '↻ SYNCING...';
  loadData().finally(() => btn.textContent = '↻ REFRESH');
}

function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => loadData().catch(() => {}), 30000);
}

function makeId() { return Math.random().toString(36).slice(2, 10); }

// ── TABS ──
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';

  // All tab
  const allTotal = Object.values(store.tasks).flat().length;
  const allDone  = Object.values(store.tasks).flat().filter(t => t.status === 'done').length;
  const allTab   = makeTab('all', 'All', '#3498db', allDone, allTotal);
  bar.appendChild(allTab);

  SUBS.forEach(sub => {
    const list  = store.tasks[sub.id] || [];
    const done  = list.filter(t => t.status === 'done').length;
    const total = list.length;
    bar.appendChild(makeTab(sub.id, sub.label, sub.color, done, total));
  });
}

function makeTab(id, label, color, done, total) {
  const tab = document.createElement('button');
  tab.className = 'tab' + (activeTab === id ? ' active' : '');
  tab.style.setProperty('--tab-color', color);
  const remaining = total - done;
  tab.innerHTML = `
    <span class="tab-dot" style="background:${color}"></span>
    ${esc(label)}
    ${remaining > 0 ? `<span class="tab-badge">${remaining}</span>` : ''}
  `;
  tab.onclick = () => { activeTab = id; renderTabs(); renderBoard(); };
  return tab;
}

// ── BOARD ──
function renderBoard() {
  // Overall stats
  const allTasks = Object.values(store.tasks).flat();
  const total    = allTasks.length;
  const done     = allTasks.filter(t => t.status === 'done').length;
  const pct      = total === 0 ? 0 : Math.round(done / total * 100);
  document.getElementById('overall-fill').style.width = pct + '%';
  document.getElementById('overall-pct').textContent  = pct + '%';

  const area = document.getElementById('main-area');

  if (activeTab === 'all') {
    renderAllView(area);
  } else {
    renderSubView(area, activeTab);
  }
}

function renderAllView(area) {
  area.className = 'all-grid';
  area.innerHTML = '';

  SUBS.forEach(sub => {
    const list  = store.tasks[sub.id] || [];
    const done  = list.filter(t => t.status === 'done').length;
    const total = list.length;
    const pct   = total === 0 ? 0 : Math.round(done / total * 100);
    const remaining = list.filter(t => t.status !== 'done');

    const col = document.createElement('div');
    col.className = 'mini-col';
    col.innerHTML = `
      <div class="mini-header" style="border-left-color:${sub.color}">
        <div class="mini-name"><div class="mini-dot" style="background:${sub.color}"></div>${esc(sub.label)}</div>
        <div class="mini-meta">${done}/${total}</div>
      </div>
      <div class="mini-progress"><div class="col-fill" style="width:${pct}%;background:${sub.color}"></div></div>
    `;

    if (remaining.length === 0 && total === 0) {
      col.innerHTML += `<div class="col-empty">No tasks</div>`;
    } else if (remaining.length === 0) {
      col.innerHTML += `<div class="col-empty" style="color:#2ecc71">All done ✓</div>`;
    } else {
      const sorted = [...remaining].sort((a, b) => {
        const order = { inprogress: 0, todo: 1, done: 2 };
        return (order[a.status] ?? 1) - (order[b.status] ?? 1);
      });
      sorted.forEach(task => col.appendChild(buildCard(task, sub, true)));
    }

    // Add button
    const addBtn = document.createElement('button');
    addBtn.className = 'col-add-btn';
    addBtn.textContent = '+ Add task';
    addBtn.onclick = () => openAddModal(sub.id);
    col.appendChild(addBtn);

    area.appendChild(col);
  });
}

function renderSubView(area, subId) {
  area.className = 'board-area';
  area.innerHTML = '';
  const sub  = SUBS.find(s => s.id === subId);
  const list = store.tasks[subId] || [];

  STATUSES.forEach(status => {
    const tasks = list.filter(t => t.status === status.id);
    const wrap  = document.createElement('div');
    wrap.className = 'col-wrap';

    // Column header
    const hdr = document.createElement('div');
    hdr.className = 'col-header';
    hdr.innerHTML = `
      <div class="col-title">
        <span class="status-pip pip-${status.id}"></span>
        ${esc(status.label)}
      </div>
      <span class="col-count-badge">${tasks.length}</span>
    `;
    wrap.appendChild(hdr);

    // Progress bar for done column
    if (status.id === 'done') {
      const total = list.length;
      const pct   = total === 0 ? 0 : Math.round(tasks.length / total * 100);
      const prog  = document.createElement('div');
      prog.className = 'col-progress';
      prog.innerHTML = `<div class="col-fill" style="width:${pct}%;background:${sub.color}"></div>`;
      wrap.appendChild(prog);
    }

    // Cards
    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'col-empty';
      empty.textContent = status.id === 'todo' ? 'No tasks yet' : status.id === 'inprogress' ? 'Nothing in progress' : 'Nothing completed yet';
      wrap.appendChild(empty);
    } else {
      tasks.forEach(task => wrap.appendChild(buildCard(task, sub, false)));
    }

    // Add button only on To Do column
    if (status.id === 'todo') {
      const addBtn = document.createElement('button');
      addBtn.className = 'col-add-btn';
      addBtn.textContent = '+ Add task';
      addBtn.onclick = () => openAddModal(subId);
      wrap.appendChild(addBtn);
    }

    area.appendChild(wrap);
  });
}

// ── CARD ──
function buildCard(task, sub, compact) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.borderLeftColor = sub.color;

  const overdue = isOverdue(task);
  const status  = STATUSES.find(s => s.id === task.status) || STATUSES[0];
  const sc      = task.status === 'done' ? '#2ecc71' : (overdue ? '#e74c3c' : status.color);

  const aHtml   = (!task.assignees || !task.assignees.length)
    ? `<span class="uchip">unassigned</span>`
    : task.assignees.map(id => `<span class="achip">${esc(shortId(id))}</span>`).join('');
  const dueHtml = task.dueDate ? `<span class="card-due${overdue ? ' overdue' : ''}">${overdue ? '⚠' : '📅'} ${esc(task.dueDate)}</span>` : '';
  const noteHtml = (!compact && task.notes) ? `<div class="card-notes">${esc(task.notes)}</div>` : '';

  card.innerHTML = `
    <div class="card-top">
      <div class="card-status" style="border-color:${sc};color:${sc}" title="${status.label}">${task.status === 'done' ? '✓' : task.status === 'inprogress' ? '◑' : ''}</div>
      <div class="card-name">${esc(task.name)}</div>
      <div class="card-actions">
        <div class="card-btn" onclick="openEditModal('${sub.id}','${task.id}')" title="Edit">✎</div>
        <div class="card-btn danger" onclick="deleteTask('${sub.id}','${task.id}')" title="Delete">✕</div>
      </div>
    </div>
    ${noteHtml}
    <div class="card-footer"><div style="display:flex;gap:.25rem;flex-wrap:wrap">${aHtml}</div>${dueHtml}</div>
  `;
  return card;
}

// ── UTILS ──
function isOverdue(t) {
  if (!t.dueDate || t.status === 'done') return false;
  const p = t.dueDate.split('/');
  if (p.length !== 3) return false;
  return new Date(p[2], p[1] - 1, p[0]) < new Date();
}

function shortId(id) { return id ? '…' + id.slice(-4) : '?'; }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ── TASK ACTIONS ──
async function deleteTask(subId, taskId) {
  if (!confirm('Delete this task?')) return;
  store.tasks[subId] = store.tasks[subId].filter(t => t.id !== taskId);
  renderTabs(); renderBoard();
  try { await saveData(); toast('Task removed', 'success'); }
  catch { toast('Save failed', 'error'); }
}

// ── MODALS ──
function openAddModal(subId) {
  const sub = SUBS.find(s => s.id === subId);
  showModal(`
    <div class="modal-title">➕ Add task — ${esc(sub.label)}</div>
    <div class="mfield"><label>TASK NAME</label><input type="text" id="m-name" placeholder="e.g. Assemble wheel mounts" maxlength="100"></div>
    <div class="mfield"><label>STATUS</label>
      <select id="m-status">
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="mfield"><label>DUE DATE (optional)</label><input type="text" id="m-due" placeholder="DD/MM/YYYY"></div>
    <div class="mfield"><label>NOTES (optional)</label><textarea id="m-notes" rows="2" placeholder="Any extra context"></textarea></div>
    <div class="mfield"><label>ASSIGN TO — Discord User IDs, comma separated</label><input type="text" id="m-assign" placeholder="Right-click user in Discord → Copy User ID"></div>
    <div class="modal-footer">
      <button class="mbtn secondary" onclick="closeModal()">Cancel</button>
      <button class="mbtn primary" onclick="addTask('${subId}')">Add Task</button>
    </div>
  `);
  document.getElementById('m-name').focus();
}

async function addTask(subId) {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { alert('Task name is required.'); return; }
  const status   = document.getElementById('m-status').value;
  const dueDate  = document.getElementById('m-due').value.trim();
  const notes    = document.getElementById('m-notes').value.trim();
  const rawIds   = document.getElementById('m-assign').value.trim();
  const assignees = rawIds ? rawIds.split(',').map(s => s.trim()).filter(Boolean) : [];
  const task = { id: makeId(), name, status, done: status === 'done', assignees, dueDate: dueDate || null, notes: notes || null, addedAt: Date.now() };
  store.tasks[subId].push(task);
  closeModal(); renderTabs(); renderBoard();
  try { await saveData(); toast('Task added', 'success'); }
  catch { toast('Save failed', 'error'); }
}

function openEditModal(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  const sub = SUBS.find(s => s.id === subId);
  showModal(`
    <div class="modal-title">✎ Edit task — ${esc(sub.label)}</div>
    <div class="mfield"><label>TASK NAME</label><input type="text" id="m-name" value="${esc(task.name)}" maxlength="100"></div>
    <div class="mfield"><label>STATUS</label>
      <select id="m-status">
        <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>To Do</option>
        <option value="inprogress" ${task.status === 'inprogress' ? 'selected' : ''}>In Progress</option>
        <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
      </select>
    </div>
    <div class="mfield"><label>DUE DATE</label><input type="text" id="m-due" value="${esc(task.dueDate || '')}" placeholder="DD/MM/YYYY"></div>
    <div class="mfield"><label>NOTES</label><textarea id="m-notes" rows="2">${esc(task.notes || '')}</textarea></div>
    <div class="mfield"><label>ASSIGN TO — Discord User IDs, comma separated</label><input type="text" id="m-assign" value="${esc((task.assignees || []).join(', '))}"></div>
    <div class="modal-footer">
      <button class="mbtn secondary" onclick="closeModal()">Cancel</button>
      <button class="mbtn danger" onclick="deleteTask('${subId}','${taskId}');closeModal()">Delete</button>
      <button class="mbtn primary" onclick="saveEdit('${subId}','${taskId}')">Save</button>
    </div>
  `);
  document.getElementById('m-name').focus();
}

async function saveEdit(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  const name = document.getElementById('m-name').value.trim();
  if (!name) { alert('Task name is required.'); return; }
  task.name      = name;
  task.status    = document.getElementById('m-status').value;
  task.done      = task.status === 'done';
  task.dueDate   = document.getElementById('m-due').value.trim() || null;
  task.notes     = document.getElementById('m-notes').value.trim() || null;
  const rawIds   = document.getElementById('m-assign').value.trim();
  task.assignees = rawIds ? rawIds.split(',').map(s => s.trim()).filter(Boolean) : [];
  closeModal(); renderTabs(); renderBoard();
  try { await saveData(); toast('Task saved', 'success'); }
  catch { toast('Save failed', 'error'); }
}

function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal')) closeModal(); }

let toastTimer = null;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── INIT ──
loadData().then(startAutoRefresh).catch(e => {
  document.getElementById('sync-info').textContent = 'CONNECTION ERROR';
  document.getElementById('main-area').innerHTML = `<div class="loading" style="color:#e74c3c">Failed to connect — check your network</div>`;
});
</script>
</body>
</html>
