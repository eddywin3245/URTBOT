async function saveEdit(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  const name = document.getElementById('m-name').value.trim();
  if (!name) { alert('Task name is required.'); return; }
  const prevStatus = task.status;
  task.name      = name;
  task.priority  = document.getElementById('m-priority').value;
  task.status    = document.getElementById('m-status').value;
  task.done      = task.status === 'done';
  task.startDate = ymdToDmy(document.getElementById('m-start').value) || null;
  task.dueDate   = ymdToDmy(document.getElementById('m-due').value) || null;
  task.notes     = document.getElementById('m-notes').value.trim() || null;
  task.assignees = getCheckedMembers();
  closeModal(); renderTabs(); renderBoard();
  try {
    await saveData();
    toast('Task saved', 'success');
    if (prevStatus !== 'done' && task.status === 'done') checkUnblocked(taskId);
  }
  catch { toast('Save failed', 'error'); }
}

// ── CHECK-INS ──
function buildCheckInDisplay(task, subId, taskId) {
  const cis = task.checkIns || [];
  if (!cis.length) return '<div style="font-size:.7em;color:var(--dim);font-family:JetBrains Mono,monospace;padding:.3rem 0">No check-ins scheduled</div>';
  return cis.map((ci, i) =>
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;background:var(--surface2);border-radius:5px;margin-bottom:.25rem">' +
    '<span style="font-size:.72em;font-family:JetBrains Mono,monospace;color:var(--text)">🕐 ' + esc(ci.date) + (ci.note ? ' — ' + esc(ci.note) : '') + '</span>' +
    '<button onclick="removeCheckIn(\''+subId+'\',\''+taskId+'\','+i+')" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:.9em;padding:.1rem .3rem">✕</button>' +
    '</div>'
  ).join('');
}

async function addCheckIn(subId, taskId) {
  const date = ymdToDmy(document.getElementById('ci-date').value);
  if (!date) { alert('Please select a date.'); return; }
  const note = document.getElementById('ci-note').value.trim();
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task) return;
  if (!task.checkIns) task.checkIns = [];
  task.checkIns.push({ id: makeId(), date, note: note || null, sent: false });
  task.checkIns.sort((a, b) => parseDmy(a.date) - parseDmy(b.date));
  document.getElementById('checkin-list').innerHTML = buildCheckInDisplay(task, subId, taskId);
  document.getElementById('ci-date').value = '';
  document.getElementById('ci-note').value = '';
  try { await saveData(); toast('Check-in added', 'success'); }
  catch { toast('Save failed', 'error'); }
}

async function removeCheckIn(subId, taskId, index) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  if (!task || !task.checkIns) return;
  task.checkIns.splice(index, 1);
  document.getElementById('checkin-list').innerHTML = buildCheckInDisplay(task, subId, taskId);
  try { await saveData(); toast('Check-in removed', 'success'); }
  catch { toast('Save failed', 'error'); }
}

// ── GOALS ──

const SG_W = 220;        // subgoal node width
const SG_HDR_H = 36;     // header height
const SG_TASK_H = 26;    // per task height
const SG_PAD = 8;        // bottom padding
const COL_GAP = 60;      // horizontal gap between columns
const ROW_GAP = 180;     // vertical gap between rows

let sgLinkSrc = null;    // {nodeId, goalId} shift+drag linking
const fcState = {};
function getFcState(id){ if(!fcState[id]) fcState[id]={scale:.8,panX:60,panY:40}; return fcState[id]; }

function getAllTasks(){
  const all=[];
  for(const sub of SUBS) for(const t of store.tasks[sub.id]||[]) all.push({...t,subId:sub.id,subLabel:sub.label,subColor:sub.color});
  return all;
}
function makeNodeId(){ return 'n'+Math.random().toString(36).slice(2,8); }

// ─── Data migration ───
function migrateGoal(goal){
  if(goal.dagNodes!==undefined) return;
  goal.dagNodes=[];
  goal.dagEdges=[];
  // Convert old lanes/nodes structure
  const lanes=goal.lanes||[];
  lanes.forEach((lane,li)=>{
    const nodes=lane.nodes||[];
    function flatten(nodes){ nodes.forEach(n=>{ 
      const id=n.nodeId||makeNodeId();
      goal.dagNodes.push({id,type:'subgoal',name:n.name||lane.name,taskIds:[],x:li*(SG_W+COL_GAP)+40,y:40+goal.dagNodes.length*120});
      if(n.children?.length) flatten(n.children);
    });}
    if(nodes.length) flatten(nodes);
    else if(lane.taskIds?.length){
      goal.dagNodes.push({id:makeNodeId(),type:'subgoal',name:lane.name,taskIds:lane.taskIds,x:li*(SG_W+COL_GAP)+40,y:40});
    }
  });
}

// ─── Progress ───
function sgNodeProgress(node, allTasks, goal){
  // Recursively collect all task IDs from this node AND all descendant subgoals
  function collectTaskIds(nodeId, visited=new Set()){
    if(visited.has(nodeId)) return [];
    visited.add(nodeId);
    const n=(goal?.dagNodes||[]).find(x=>x.id===nodeId);
    const ownIds=n?(n.taskIds||[]):[];
    // Find all children (nodes this one depends on = outgoing edges)
    const childIds=(goal?.dagEdges||[]).filter(e=>e.from===nodeId).map(e=>e.to);
    const childTaskIds=childIds.flatMap(cid=>collectTaskIds(cid,visited));
    return [...ownIds,...childTaskIds];
  }
  const allIds=collectTaskIds(node.id);
  const unique=[...new Set(allIds)];
  const tasks=unique.map(id=>allTasks.find(t=>t.id===id)).filter(Boolean);
  const done=tasks.filter(t=>t.status==='done').length;
  return{done,total:tasks.length,pct:tasks.length?Math.round(done/tasks.length*100):0};
}

function goalProgress(goal){
  migrateGoal(goal);
  const at=getAllTasks();
  const allIds=new Set((goal.dagNodes||[]).flatMap(n=>n.taskIds||[]));
  const linked=[...allIds].map(id=>at.find(t=>t.id===id)).filter(Boolean);
  const done=linked.filter(t=>t.status==='done').length;
  return{done,total:linked.length,pct:linked.length?Math.round(done/linked.length*100):0};
}

function isNodeBlocked(nodeId,goal,allTasks){
  // Node is blocked if any node it depends ON (outgoing edge target) is incomplete
  return (goal.dagEdges||[]).filter(e=>e.from===nodeId).some(e=>{
    const dep=(goal.dagNodes||[]).find(n=>n.id===e.to);
    if(!dep) return false;
    return sgNodeProgress(dep,allTasks,goal).pct<100;
  });
}

function isGoalBlocked(goal){
  return(goal.dependsOn||[]).some(id=>{
    const g=(store.goals||[]).find(x=>x.id===id);
    return g&&goalProgress(g).pct<100;
  });
}

function wouldCycle(goal,from,to){
  const seen=new Set(); const q=[to];
  while(q.length){const c=q.shift();if(c===from)return true;if(seen.has(c))continue;seen.add(c);(goal.dagEdges||[]).filter(e=>e.from===c).forEach(e=>q.push(e.to));}
  return false;
}

// ─── Auto layout (top-down, goal as root at top) ───
function autoLayout(goal){
  const nodes=goal.dagNodes||[]; const edges=goal.dagEdges||[];
  if(!nodes.length) return;

  const H_GAP=60;  // horizontal gap between siblings
  const V_GAP=180; // vertical gap between levels - must be > max node height
  const TOP=40;

  // Build children map: parent -> [children] (edges go from parent down to dependency)
  const children={};
  const parentCount={};
  nodes.forEach(n=>{children[n.id]=[];parentCount[n.id]=0;});
  edges.forEach(e=>{
    if(children[e.from]&&!children[e.from].includes(e.to)) children[e.from].push(e.to);
    if(parentCount[e.to]!==undefined) parentCount[e.to]++;
  });

  // Find roots (nodes with no incoming edges - nothing depends on them = tops)
  const roots=nodes.filter(n=>parentCount[n.id]===0).map(n=>n.id);
  // Nodes with no parents that aren't in edges at all
  if(!roots.length) roots.push(nodes[0].id);

  // Reingold-Tilford style: compute subtree width bottom-up, then assign x top-down
  const subtreeW={}; // minimum width needed for subtree rooted at node

  function computeWidth(id, visited=new Set()){
    if(visited.has(id)){subtreeW[id]=SG_W;return SG_W;}
    visited.add(id);
    const kids=children[id]||[];
    if(!kids.length){subtreeW[id]=SG_W;return SG_W;}
    const kidsW=kids.reduce((sum,kid)=>sum+computeWidth(kid,new Set(visited)),0)+(kids.length-1)*H_GAP;
    subtreeW[id]=Math.max(SG_W,kidsW);
    return subtreeW[id];
  }
  roots.forEach(r=>computeWidth(r));

  // Assign positions top-down
  function assignPos(id, centerX, depth, visited=new Set()){
    if(visited.has(id)) return;
    visited.add(id);
    const n=nodes.find(x=>x.id===id); if(!n) return;
    n.x=centerX - SG_W/2;
    n.y=TOP + depth*V_GAP;
    const kids=children[id]||[];
    if(!kids.length) return;
    const totalKidsW=kids.reduce((s,k)=>s+(subtreeW[k]||SG_W),0)+(kids.length-1)*H_GAP;
    let curX=centerX - totalKidsW/2;
    kids.forEach(kid=>{
      const kw=subtreeW[kid]||SG_W;
      assignPos(kid, curX+kw/2, depth+1, visited);
      curX+=kw+H_GAP;
    });
  }

  // Layout all roots side by side
  const totalRootsW=roots.reduce((s,r)=>s+(subtreeW[r]||SG_W),0)+(roots.length-1)*H_GAP;
  let rx=totalRootsW/2+40;
  // Actually start from left with padding
  let startX=40+SG_W/2;
  roots.forEach(r=>{
    assignPos(r, startX+(subtreeW[r]||SG_W)/2, 0);
    startX+=subtreeW[r]+H_GAP;
  });

  // Place any disconnected nodes to the right
  const placed=new Set(nodes.filter(n=>n.x!==undefined&&!isNaN(n.x)).map(n=>n.id));
  let floatX=startX+H_GAP; let floatY=TOP;
  nodes.filter(n=>!placed.has(n.id)||isNaN(n.x)).forEach(n=>{
    n.x=floatX; n.y=floatY; floatY+=V_GAP;
  });
}

// ─── Subgoal node height ───
function sgHeight(node,allTasks){
  const tasks=(node.taskIds||[]).filter(id=>{const t=allTasks.find(x=>x.id===id);return !t||t.status!=='done';});
  return SG_HDR_H+4+(tasks.length*SG_TASK_H)+SG_PAD+28+28; // hdr+prog+tasks+addBtn+actionRow
}

// ─── Main render ───
function renderGoalsView(area){
  area.className='goals-area'; area.innerHTML='';
  if(!store.goals) store.goals=[];
  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem';
  hdr.innerHTML='<div style="font-size:.85em;font-weight:700;color:var(--text)">🎯 Goals</div>'+
    '<button onclick="openAddGoalModal()" class="mbtn primary" style="font-size:.72em">+ New Goal</button>';
  area.appendChild(hdr);
  if(!store.goals.length){
    const e=document.createElement('div');
    e.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:.75rem;color:var(--dim);font-size:.78em;font-family:JetBrains Mono,monospace';
    e.innerHTML='<div style="font-size:2.5em">🎯</div><div>No goals yet</div>';
    area.appendChild(e); return;
  }
  const allTasks=getAllTasks();
  store.goals.forEach(goal=>{ try{ renderGoalCard(goal,allTasks,area); } catch(e){ console.error(e); } });
}

function renderGoalCard(goal,allTasks,area){
  migrateGoal(goal);
  const{done,total,pct}=goalProgress(goal);
  const dl=goal.deadline?Math.round((parseDmy(goal.deadline)-Date.now())/86400000):null;
  const dlCol=dl===null?'var(--muted)':dl<0?'#e74c3c':dl<=14?'#f1c40f':'#2ecc71';
  const dlTxt=dl===null?'No deadline':dl<0?'Overdue '+Math.abs(dl)+'d':dl===0?'Today!':dl+'d left';
  const fill=pct===100?'#2ecc71':pct>50?'#3498db':pct>20?'#f1c40f':'#e74c3c';
  const blocked=isGoalBlocked(goal);
  const blockingGoals=(goal.dependsOn||[]).map(id=>(store.goals||[]).find(g=>g.id===id)).filter(Boolean);
  const s=getFcState(goal.id);

  const card=document.createElement('div'); card.className='goal-card';

  // Header
  const chdr=document.createElement('div'); chdr.className='goal-card-hdr';
  chdr.innerHTML='<div class="goal-card-hdr-left">'+
    '<div class="goal-title">'+(blocked?'⏳ ':'🎯 ')+esc(goal.name)+'</div>'+
    '<div class="goal-meta">'+
      '<span style="color:'+dlCol+'">📅 '+dlTxt+'</span>'+
      '<span>'+done+'/'+total+' tasks done</span>'+
      '<span style="color:'+fill+'">'+pct+'%</span>'+
      (blockingGoals.length?'<span style="color:#f1c40f">⏳ blocked by: '+blockingGoals.map(g=>esc(g.name)).join(', ')+'</span>':'')+
    '</div></div>'+
    '<div style="display:flex;gap:.35rem;align-items:center">'+
      '<button data-gid="'+goal.id+'" onclick="openGoalDepsModal(this.dataset.gid)" class="admin-nudge-btn" style="color:#9b59b6;border-color:rgba(155,89,182,.3)">🔗 Goal Deps</button>'+
      '<button data-gid="'+goal.id+'" onclick="addSgNode(this.dataset.gid)" class="admin-nudge-btn" style="color:#e67e22;border-color:rgba(230,126,34,.3)">+ Subgoal</button>'+
      '<button data-gid="'+goal.id+'" onclick="doLayout(this.dataset.gid)" class="admin-nudge-btn" style="color:var(--muted);border-color:var(--border2)">⟳ Layout</button>'+
      '<button data-gid="'+goal.id+'" onclick="openEditGoalModal(this.dataset.gid)" style="padding:.2rem .5rem;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-size:.65em;cursor:pointer">✎</button>'+
    '</div>';
  card.appendChild(chdr);

  // Progress bar
  const pw=document.createElement('div'); pw.className='goal-progress-wrap';
  pw.innerHTML='<div class="goal-progress-bar"><div class="goal-progress-fill" style="width:'+pct+'%;background:'+fill+'"></div></div>'+
    '<div class="goal-progress-nums"><span>'+pct+'% overall</span><span>'+done+'/'+total+' tasks</span></div>';
  card.appendChild(pw);

  // Hint
  const hint=document.createElement('div'); hint.className='dag-hint';
  hint.innerHTML='<span>🖱 Drag background to pan · scroll to zoom</span>'+
    '<span>🔴 Click right circle on a node, then left circle on another to link</span>'+
    '<span>Click arrow to remove dependency</span>';
  card.appendChild(hint);

  // Viewport
  const vp=document.createElement('div'); vp.className='dag-vp';
  const cvs=document.createElement('div'); cvs.className='dag-cvs';
  cvs.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.scale})`;

  // SVG for edges
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.className='dag-overlay'; svg.style.cssText='position:absolute;top:0;left:0;width:5000px;height:5000px;overflow:visible;pointer-events:none;z-index:1';
  svg.innerHTML='<defs>'+
    '<marker id="sg-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">'+
      '<polygon points="0 0,10 4,0 8" fill="rgba(230,126,34,.8)"/>'+
    '</marker>'+
    '<marker id="sg-arr-h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">'+
      '<polygon points="0 0,10 4,0 8" fill="#e67e22"/>'+
    '</marker>'+
    '</defs>';
  cvs.appendChild(svg);

  // Pan
  let isPanning=false,ps={x:0,y:0};
  vp.addEventListener('mousedown',e=>{
    if(sgLinkSrc&&!e.target.closest('.sgn-port-in')){
      // Cancel linking
      sgLinkSrc=null;
      cvs.querySelectorAll('.sgn-port').forEach(p=>p.classList.remove('port-active'));
      cvs.querySelectorAll('.sgn').forEach(n=>n.classList.remove('sg-can-link'));
      vp.classList.remove('linking');
    }
    if(e.target.closest('.sgn,button,input,select')||sgLinkSrc) return;
    isPanning=true; vp.classList.add('panning');
    ps={x:e.clientX-s.panX,y:e.clientY-s.panY}; e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!isPanning) return;
    s.panX=e.clientX-ps.x; s.panY=e.clientY-ps.y;
    cvs.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.scale})`;
  });
  window.addEventListener('mouseup',()=>{isPanning=false;vp.classList.remove('panning');});
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    s.scale=Math.min(3,Math.max(.1,+(s.scale*(e.deltaY>0?.9:1.1)).toFixed(2)));
    cvs.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.scale})`;
    vp.querySelector('.dag-zoom-pct')&&(vp.querySelector('.dag-zoom-pct').textContent=Math.round(s.scale*100)+'%');
    setTimeout(()=>redrawEdges(goal,allTasks),30);
  },{passive:false});

  function redraw(){ drawEdges(svg,goal,allTasks,cvs); }

  // Render all nodes
  (goal.dagNodes||[]).forEach(node=>{
    const el=buildSgNode(node,goal,allTasks,s,cvs,svg,redraw);
    cvs.appendChild(el);
  });
  // Delay edge drawing so DOM layout is complete and heights are measurable
  setTimeout(()=>redraw(), 50);
  setTimeout(()=>redraw(), 200);

  // Zoom controls
  const zc=document.createElement('div'); zc.className='dag-zoom';
  const pctEl=document.createElement('div'); pctEl.className='dag-zoom-pct'; pctEl.textContent=Math.round(s.scale*100)+'%';
  const applyScale=()=>{
    cvs.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.scale})`;
    pctEl.textContent=Math.round(s.scale*100)+'%';
    setTimeout(()=>redrawEdges(goal,allTasks),50);
  };
  const mkZ=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;return b;};
  zc.appendChild(mkZ('＋',()=>{s.scale=Math.min(3,+(s.scale+0.1).toFixed(2));applyScale();}));
  zc.appendChild(pctEl);
  zc.appendChild(mkZ('－',()=>{s.scale=Math.max(.1,+(s.scale-0.1).toFixed(2));applyScale();}));
  zc.appendChild(mkZ('⌂',()=>{s.scale=.8;s.panX=60;s.panY=40;applyScale();}));
  vp.appendChild(cvs); vp.appendChild(zc);
  card.appendChild(vp); area.appendChild(card);
}

function buildSgNode(node,goal,allTasks,s,cvs,svg,redraw){
  const tasks=(node.taskIds||[]).map(id=>allTasks.find(t=>t.id===id)).filter(Boolean);
  const visibleTasks=tasks.filter(t=>t.status!=='done');
  const{done,total,pct}=sgNodeProgress(node,allTasks,goal);
  const blocked=isNodeBlocked(node.id,goal,allTasks);
  const isDone=total>0&&pct===100;
  const isRoot=(goal.dagEdges||[]).filter(e=>e.to===node.id).length===0;
  const fill=isDone?'#2ecc71':pct>50?'#3498db':pct>0?'#f1c40f':'rgba(230,126,34,.4)';

  const el=document.createElement('div'); el.className='sgn'+(isRoot?' sg-root':'')+(blocked?' sg-blocked':'')+(isDone?' sg-done':'');
  el.dataset.nodeId=node.id;
  el.style.left=node.x+'px'; el.style.top=node.y+'px';

  // Header
  const hdr=document.createElement('div'); hdr.className=isRoot?'sgn-hdr-root':'sgn-hdr';
  const titleEl=document.createElement('div'); titleEl.className=isRoot?'sgn-title-root':'sgn-title';
  titleEl.textContent=(isRoot?'🎯 ':'📌 ')+node.name;
  const countEl=document.createElement('span');
  countEl.style.cssText='font-size:.65em;color:var(--muted);font-family:JetBrains Mono,monospace;flex-shrink:0';
  countEl.textContent=done+'/'+total;
  const dragHandle=document.createElement('span');
  dragHandle.style.cssText='color:rgba(230,126,34,.4);font-size:.85em;flex-shrink:0;cursor:grab';
  dragHandle.textContent='⠿';
  hdr.appendChild(dragHandle); hdr.appendChild(titleEl); hdr.appendChild(countEl);
  el.appendChild(hdr);

  // Progress bar
  const prog=document.createElement('div'); prog.className='sgn-prog';
  const progFill=document.createElement('div'); progFill.className='sgn-prog-fill';
  progFill.style.cssText=`width:${pct}%;background:${fill}`;
  prog.appendChild(progFill); el.appendChild(prog);

  // Tasks
  const taskList=document.createElement('div'); taskList.className='sgn-tasks';
  visibleTasks.forEach(task=>{
    const sub=SUBS.find(s=>s.id===task.subId);
    const pri=task.priority==='high'?'🔴':task.priority==='medium'?'🟡':task.priority==='low'?'🟢':'';
    const tc=document.createElement('div');
    tc.className='sgn-task'+(task.status==='done'?' t-done':task.status==='inprogress'?' t-inprog':'');
    tc.style.borderLeftColor=sub?.color||'var(--border2)';
    tc.innerHTML='<span style="color:var(--muted);flex-shrink:0">'+(task.status==='inprogress'?'◑':'–')+'</span>'+
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e8edf5">'+esc(task.name)+'</span>'+
      (pri?'<span style="flex-shrink:0">'+pri+'</span>':'');
    tc.onclick=e=>{e.stopPropagation();if(!sgLinkSrc)openEditModal(task.subId,task.id);};
    taskList.appendChild(tc);
  });
  el.appendChild(taskList);

  // Add task button
  const addT=document.createElement('div'); addT.className='sgn-add-task';
  addT.textContent='+ Add tasks';
  addT.dataset.gid=goal.id; addT.dataset.nid=node.id;
  addT.onclick=e=>{e.stopPropagation();openAddTasksToNode(addT.dataset.gid,addT.dataset.nid);};
  el.appendChild(addT);

  // Action row
  const actions=document.createElement('div'); actions.className='sgn-actions';
  const editBtn=document.createElement('div'); editBtn.className='sgn-btn';
  editBtn.style.cssText='color:var(--muted);border-color:var(--border2);background:transparent;font-size:.58em;padding:.15rem .4rem;border-radius:4px;cursor:pointer;font-family:JetBrains Mono,monospace';
  editBtn.textContent='✎ Edit';
  editBtn.dataset.gid=goal.id; editBtn.dataset.nid=node.id;
  editBtn.onclick=e=>{e.stopPropagation();openEditSgNode(editBtn.dataset.gid,editBtn.dataset.nid);};

  const addSgBtn=document.createElement('div'); addSgBtn.className='sgn-btn';
  addSgBtn.style.cssText='color:rgba(230,126,34,.8);border-color:rgba(230,126,34,.3);background:transparent;font-size:.58em;padding:.15rem .4rem;border-radius:4px;cursor:pointer;font-family:JetBrains Mono,monospace';
  addSgBtn.textContent='+ Sub-subgoal';
  addSgBtn.dataset.gid=goal.id; addSgBtn.dataset.nid=node.id;
  addSgBtn.onclick=async e=>{
    e.stopPropagation();
    const name=prompt('Sub-subgoal name:'); if(!name?.trim()) return;
    const g=(store.goals||[]).find(x=>x.id===addSgBtn.dataset.gid); if(!g) return;
    const parent=(g.dagNodes||[]).find(n=>n.id===addSgBtn.dataset.nid); if(!parent) return;
    const newNode={id:makeNodeId(),type:'subgoal',name:name.trim(),taskIds:[],x:parent.x,y:parent.y+140};
    g.dagNodes.push(newNode);
    if(!g.dagEdges) g.dagEdges=[];
    g.dagEdges.push({id:makeNodeId(),from:parent.id,to:newNode.id});
    renderBoard();
    try{await saveData();toast('Sub-subgoal added','success');}catch{}
  };

  actions.appendChild(editBtn); actions.appendChild(addSgBtn);
  el.appendChild(actions);

  // Ports appended directly to cvs so they're never clipped
  function makePorts(){
    cvs.querySelectorAll('[data-port-node="'+node.id+'"]').forEach(p=>p.remove());
    const elH=el.offsetHeight||120;
    const midY=node.y+elH/2;
    console.log('makePorts',node.name,'elH:',elH,'midY:',midY,'x:',node.x);

    const portOut=document.createElement('div');
    portOut.className='sgn-port sgn-port-out';
    portOut.dataset.portNode=node.id;
    portOut.style.cssText='left:'+(node.x+220)+'px;top:'+(midY-8)+'px';
    portOut.title='Link from here';
    portOut.addEventListener('click',e=>{
      e.stopPropagation();
      if(sgLinkSrc&&sgLinkSrc.nodeId===node.id){
        sgLinkSrc=null;
        cvs.querySelectorAll('.sgn-port').forEach(p=>p.classList.remove('port-active'));
        cvs.querySelectorAll('.sgn').forEach(n=>n.classList.remove('sg-can-link'));
        vp.classList.remove('linking'); return;
      }
      sgLinkSrc={nodeId:node.id,goalId:goal.id};
      vp.classList.add('linking');
      cvs.querySelectorAll('.sgn-port').forEach(p=>p.classList.remove('port-active'));
      portOut.classList.add('port-active');
      cvs.querySelectorAll('.sgn').forEach(n=>{ if(n!==el) n.classList.add('sg-can-link'); });
      toast('Click the ◉ left circle on another subgoal to connect','success');
    });

    const portIn=document.createElement('div');
    portIn.className='sgn-port sgn-port-in';
    portIn.dataset.portNode=node.id;
    portIn.style.cssText='left:'+(node.x-8)+'px;top:'+(midY-8)+'px';
    portIn.title='Receive link here';
    portIn.addEventListener('click',async e=>{
      e.stopPropagation();
      if(!sgLinkSrc||sgLinkSrc.goalId!==goal.id||sgLinkSrc.nodeId===node.id) return;
      const srcId=sgLinkSrc.nodeId;
      if(wouldCycle(goal,srcId,node.id)){
        toast('Would create a circular dependency','error');
      } else {
        if(!goal.dagEdges) goal.dagEdges=[];
        if(!goal.dagEdges.some(x=>x.from===srcId&&x.to===node.id)){
          goal.dagEdges.push({id:makeNodeId(),from:srcId,to:node.id});
          renderBoard();
          try{await saveData();toast('Linked ✓','success');}catch{}
          return;
        } else toast('Already linked','error');
      }
      sgLinkSrc=null;
      cvs.querySelectorAll('.sgn-port').forEach(p=>p.classList.remove('port-active'));
      cvs.querySelectorAll('.sgn').forEach(n=>n.classList.remove('sg-can-link'));
      vp.classList.remove('linking');
    });

    cvs.appendChild(portOut);
    cvs.appendChild(portIn);
  }
  // Make ports after a short delay so el has rendered height
  setTimeout(makePorts, 80);

  // Remove button
  const rm=document.createElement('div'); rm.className='sgn-rm'; rm.textContent='✕';
  rm.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm('Remove this subgoal? Tasks stay in the system.')) return;
    goal.dagNodes=(goal.dagNodes||[]).filter(n=>n.id!==node.id);
    goal.dagEdges=(goal.dagEdges||[]).filter(e=>e.from!==node.id&&e.to!==node.id);
    renderBoard();
    try{await saveData();toast('Removed','success');}catch{}
  });
  el.appendChild(rm);

  // Drag to move
  let dragging=false,ds={x:0,y:0},ns={x:0,y:0};

  hdr.addEventListener('mousedown',e=>{
    if(e.target.closest('button')||sgLinkSrc) return;

    dragging=true; ds={x:e.clientX,y:e.clientY}; ns={x:node.x,y:node.y};
    e.stopPropagation(); e.preventDefault();
  });

  const onMove=e=>{
    if(!dragging) return;
    node.x=Math.max(0,ns.x+(e.clientX-ds.x)/s.scale);
    node.y=Math.max(0,ns.y+(e.clientY-ds.y)/s.scale);
    el.style.left=node.x+'px'; el.style.top=node.y+'px';
    // Update port positions
    const elH=el.offsetHeight||100;
    const midY=node.y+elH/2;
    const po=cvs.querySelector('.sgn-port-out[data-port-node="'+node.id+'"]');
    const pi=cvs.querySelector('.sgn-port-in[data-port-node="'+node.id+'"]');
    if(po){po.style.left=(node.x+220)+'px';po.style.top=(midY-8)+'px';}
    if(pi){pi.style.left=(node.x-8)+'px';pi.style.top=(midY-8)+'px';}
    redraw();
  };
  const onUp=async e=>{
    if(dragging){ dragging=false; try{await saveData();}catch{} }
    // Handle link drop
    if(sgLinkSrc&&sgLinkSrc.goalId===goal.id&&sgLinkSrc.nodeId!==node.id){
      const srcId=sgLinkSrc.nodeId;
      if(!wouldCycle(goal,srcId,node.id)){
        if(!goal.dagEdges) goal.dagEdges=[];
        if(!goal.dagEdges.some(e=>e.from===srcId&&e.to===node.id)){
          goal.dagEdges.push({id:makeNodeId(),from:srcId,to:node.id});
          renderBoard();
          try{await saveData();toast('Linked — arrow flows down to dependency','success');}catch{}
        }
      } else toast('Would create a cycle','error');
      sgLinkSrc=null;
      vp.classList.remove('linking');
      cvs.querySelectorAll('.sgn').forEach(n=>n.classList.remove('sg-linking','sg-can-link'));
    }
  };
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  // Also handle drop on the node body (not just header)
  el.addEventListener('mouseup', onUp);
  window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sgLinkSrc){ sgLinkSrc=null; cvs.querySelectorAll('.sgn').forEach(n=>n.classList.remove('sg-linking','sg-can-link')); } });

  // Hover highlight
  el.addEventListener('mouseenter',()=>highlightEdges(svg,node.id,true));
  el.addEventListener('mouseleave',()=>highlightEdges(svg,node.id,false));

  return el;
}

function drawEdges(svg,goal,allTasks,cvs){
  svg.querySelectorAll('.dag-e,.dag-e-hit').forEach(e=>e.remove());
  (goal.dagEdges||[]).forEach(edge=>{
    const fn=(goal.dagNodes||[]).find(n=>n.id===edge.from);
    const tn=(goal.dagNodes||[]).find(n=>n.id===edge.to);
    if(!fn||!tn) return;

    // From-node bottom center → to-node top center
    const fnH=estimateH(fn,allTasks,cvs);
    const fx=fn.x+SG_W/2, fy=fn.y+fnH+4; // start below node
    const tx=tn.x+SG_W/2, ty=tn.y-4;     // end above node

    // Cubic bezier - vertical S-curve with generous control points
    const dy=Math.max(ty-fy,30);
    const cp=Math.max(dy*0.6,60);
    const d=`M${fx},${fy} C${fx},${fy+cp} ${tx},${ty-cp} ${tx},${ty}`;

    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d); path.setAttribute('class','dag-e');
    path.setAttribute('data-from',edge.from); path.setAttribute('data-to',edge.to); path.setAttribute('data-eid',edge.id);
    path.style.cssText='fill:none;stroke:rgba(230,126,34,.55);stroke-width:2.5;marker-end:url(#sg-arr)';
    svg.appendChild(path);

    // Hit area for clicking to remove
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d); hit.setAttribute('class','dag-e-hit');
    hit.style.cssText='fill:none;stroke:transparent;stroke-width:18;cursor:pointer;pointer-events:stroke';
    hit.addEventListener('click',async e=>{
      if(!confirm('Remove this dependency link?')) return;
      goal.dagEdges=(goal.dagEdges||[]).filter(x=>x.id!==edge.id);
      renderBoard();
      try{await saveData();toast('Link removed','success');}catch{}
    });
    svg.appendChild(hit);
  });
}

function estimateH(node,allTasks,cvs){
  // Measure actual rendered height - getBoundingClientRect works on absolute elements
  if(cvs){
    const el=cvs.querySelector('[data-node-id="'+node.id+'"]');
    if(el){
      const r=el.getBoundingClientRect();
      if(r.height>0) return r.height/getFcStateFromCvs(cvs).scale;
    }
  }
  // Fallback: calculate from content
  const visible=(node.taskIds||[]).filter(id=>{ const t=allTasks.find(x=>x.id===id); return !t||t.status!=='done'; }).length;
  return SG_HDR_H+6+visible*SG_TASK_H+SG_PAD+28+28;
}
function getFcStateFromCvs(cvs){
  // Extract scale from canvas transform
  const t=cvs.style.transform||'';
  const m=t.match(/scale\(([^)]+)\)/);
  return{scale:m?parseFloat(m[1]):1};
}

function redrawEdges(goal,allTasks){
  // Called after zoom to redraw edges with updated measurements
  // Edges are in the active viewport's svg - find it by looking at all dag-vp elements
  document.querySelectorAll('.dag-cvs').forEach(cvs=>{
    const svg=cvs.querySelector('.dag-overlay');
    if(svg) drawEdges(svg,goal,allTasks,cvs);
  });
}
function highlightEdges(svg,nodeId,on){
  svg.querySelectorAll('.dag-e').forEach(el=>{
    if(el.dataset.from===nodeId||el.dataset.to===nodeId){
      el.style.stroke=on?'#e67e22':'rgba(230,126,34,.55)';
      el.style.strokeWidth=on?'3.5':'2.5';
      el.setAttribute('marker-end',on?'url(#sg-arr-h)':'url(#sg-arr)');
    }
  });
}

function buildMeetingMemberList(selected) {
  const members = store.members || {};

  return Object.entries(members).map(([id, name]) =>
    '<label style="display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem;border-radius:6px;cursor:pointer" class="mt-member-label">' +
    '<input type="checkbox" class="mt-member-cb" value="' + esc(id) + '" ' + (selected.includes(id) ? 'checked' : '') + ' style="width:14px;height:14px;accent-color:#3498db;flex-shrink:0;cursor:pointer">' +
    '<span style="font-size:.78em;font-family:JetBrains Mono,monospace;color:var(--text)">' + esc(name) + '</span>' +
    '</label>'
  ).join('');
}

function filterMeetingMembers() {
  const q = (document.getElementById('mt-search')?.value || '').toLowerCase();
  document.querySelectorAll('.mt-member-label').forEach(label => {
    const name = label.querySelector('span')?.textContent.toLowerCase() || '';
    label.style.display = name.includes(q) ? '' : 'none';
  });
}

function getMeetingChecked() {
  return [...document.querySelectorAll('.mt-member-cb:checked')].map(cb => cb.value);
}

async function addMeeting() {
  const title    = document.getElementById('mt-title').value.trim();
  const dateRaw  = document.getElementById('mt-date').value;
  const time     = document.getElementById('mt-time').value;
  const location = document.getElementById('mt-location').value.trim();
  const notes    = document.getElementById('mt-notes').value.trim();

  if (!title || !dateRaw || !time) { alert('Title, date and time are required.'); return; }
  const date = ymdToDmy(dateRaw);
  const meeting = { id: makeId(), title, date, time, location: location || null, notes: notes || null, attendees, reminderSent: false, pastSent: false, addedAt: Date.now() };
  if (!store.meetings) store.meetings = [];
  store.meetings.push(meeting);
  closeModal();
  if (activeTab === 'calendar') renderBoard();
  renderMilestoneBar();
  try {
    await saveData();
    toast('Meeting scheduled! Members will be notified via Discord DM.', 'success');
  } catch { toast('Save failed', 'error'); }
}

async function saveMeeting(meetingId) {
  const mt = (store.meetings || []).find(m => m.id === meetingId);
  if (!mt) return;
  const title   = document.getElementById('mt-title').value.trim();
  const dateRaw = document.getElementById('mt-date').value;
  const time    = document.getElementById('mt-time').value;

  try { await saveData(); toast('Meeting deleted', 'success'); }

}

function renderAdminView(area) {
  if (!adminUnlocked) {

      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:1rem">' +
      '<div style="font-size:3em">🔐</div>' +

      '<button onclick="checkAdminPin()" class="mbtn primary" style="margin-top:.5rem">🔓 Unlock</button>' +
      '</div>';
    return;
  }

  area.className = 'admin-area';
  area.innerHTML = '';

  // Header
  const hdr = document.createElement('div');
  hdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between';
  hdr.innerHTML = '<div style="font-size:.85em;font-weight:700;color:var(--text)">🔐 Project Lead Panel</div>' +
    '<button onclick="lockAdmin()" style="padding:.3rem .7rem;background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--muted);font-size:.65em;font-family:JetBrains Mono,monospace;cursor:pointer">🔒 Lock</button>';
  area.appendChild(hdr);

  // 1. Notepad — one large free-form notepad for the project lead
  const notepadSec = document.createElement('div');
  notepadSec.className = 'admin-section';
  notepadSec.innerHTML = '<div class="admin-section-hdr"><div class="admin-section-title">📓 Project Lead Notepad</div><span style="font-size:.6em;color:var(--dim);font-family:JetBrains Mono,monospace">Auto-saves</span></div>';
  const notepadBody = document.createElement('div');
  notepadBody.className = 'admin-section-body';
  if (!store.adminNotes) store.adminNotes = {};
  const notepad = document.createElement('textarea');
  notepad.className = 'admin-note-area';
  notepad.style.minHeight = '200px';
  notepad.style.width = '100%';
  notepad.placeholder = 'Your private notes, ideas, to-dos...';
  notepad.value = store.adminNotes['__notepad__'] || '';
  let notepadTimer = null;
  notepad.addEventListener('input', () => {
    clearTimeout(notepadTimer);
    notepadTimer = setTimeout(async () => {
      store.adminNotes['__notepad__'] = notepad.value;
      try { await saveData(); toast('Saved', 'success'); } catch { toast('Save failed', 'error'); }
    }, 1000);
  });
  notepadBody.appendChild(notepad);
  notepadSec.appendChild(notepadBody);
  area.appendChild(notepadSec);

  // 2. Private Subsystem Notes
  const notesSec = document.createElement('div');
  notesSec.className = 'admin-section';
  notesSec.innerHTML = '<div class="admin-section-hdr"><div class="admin-section-title">📝 Private Subsystem Notes</div></div>';
  const notesBody = document.createElement('div');
  notesBody.className = 'admin-section-body';
  notesBody.style.display = 'flex';
  notesBody.style.flexDirection = 'column';
  notesBody.style.gap = '.75rem';
  if (!store.adminNotes) store.adminNotes = {};
  SUBS.forEach(sub => {
    const wrap = document.createElement('div');
    wrap.innerHTML =
      '<div style="font-size:.65em;letter-spacing:.1em;color:var(--muted);font-family:JetBrains Mono,monospace;margin-bottom:.3rem">' + esc(sub.label).toUpperCase() + '</div>' +
      '<textarea class="admin-note-area" data-sub="' + sub.id + '" placeholder="Private notes for ' + esc(sub.label) + '...">' + esc(store.adminNotes[sub.id] || '') + '</textarea>';
    const ta = wrap.querySelector('textarea');
    let noteTimer = null;
    ta.addEventListener('input', () => {
      clearTimeout(noteTimer);
      noteTimer = setTimeout(async () => {
        if (!store.adminNotes) store.adminNotes = {};
        store.adminNotes[sub.id] = ta.value;
        try { await saveData(); toast('Note saved', 'success'); } catch { toast('Save failed', 'error'); }
      }, 1000);
    });
    notesBody.appendChild(wrap);
  });
  notesSec.appendChild(notesBody);
  area.appendChild(notesSec);

  // 3. Personal Reminders
  const remSec = document.createElement('div');
  remSec.className = 'admin-section';
  remSec.innerHTML = '<div class="admin-section-hdr"><div class="admin-section-title">🔔 Personal Reminders</div><button onclick="openAddReminderModal()" class="admin-nudge-btn">+ Add</button></div>';
  const remBody = document.createElement('div');
  remBody.className = 'admin-section-body';

  // Mini calendar
  const reminders = store.adminReminders || [];
  const now = new Date();
  const calYear = now.getFullYear(), calMonth = now.getMonth();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  const monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });

  const remindersByDate = {};
  reminders.forEach(r => { if (!remindersByDate[r.date]) remindersByDate[r.date] = []; remindersByDate[r.date].push(r); });

  let calHtml = '<div style="font-size:.72em;font-weight:700;margin-bottom:.4rem;color:var(--text)">' + monthName + '</div>';
  calHtml += '<div class="admin-cal-grid">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => { calHtml += '<div class="admin-cal-day-hdr">' + d + '</div>'; });
  for (let i = 0; i < firstDay; i++) calHtml += '<div class="admin-cal-cell" style="background:transparent;border-color:transparent"></div>';
  for (let d = 1; d <= lastDate; d++) {
    const dmy = String(d).padStart(2,'0') + '/' + String(calMonth+1).padStart(2,'0') + '/' + calYear;
    const isToday = d === now.getDate();
    const hasRem = remindersByDate[dmy]?.length > 0;
    calHtml += '<div class="admin-cal-cell' + (isToday ? ' today' : '') + (hasRem ? ' has-reminder' : '') + '">';
    calHtml += '<div class="admin-cal-date">' + d + '</div>';
    if (hasRem) remindersByDate[dmy].forEach(r => { calHtml += '<div class="admin-cal-chip" data-rid="' + r.id + '" onclick="openEditReminderModal(this.dataset.rid)">' + esc(r.title) + '</div>'; });
    calHtml += '</div>';
  }
  calHtml += '</div>';
  remBody.innerHTML = calHtml;

  // Reminder list
  if (reminders.length) {
    const listDiv = document.createElement('div');
    listDiv.style.marginTop = '.75rem';
    const sorted = [...reminders].sort((a,b) => parseDmy(a.date) - parseDmy(b.date));
    sorted.forEach(r => {
      const row = document.createElement('div');
      row.className = 'admin-reminder-row';
      const daysLeft = Math.round((parseDmy(r.date) - Date.now()) / 86400000);
      const when = daysLeft < 0 ? 'Past' : daysLeft === 0 ? 'Today' : 'in ' + daysLeft + 'd';
      const color = daysLeft < 0 ? 'var(--dim)' : daysLeft <= 2 ? '#e74c3c' : '#f1c40f';
      row.innerHTML =
        '<div style="font-size:.78em;color:var(--text)">' + esc(r.title) + (r.repeat ? ' <span style="color:var(--muted);font-size:.85em">↺ ' + esc(r.repeat) + '</span>' : '') + '</div>' +
        '<div style="font-family:JetBrains Mono,monospace;font-size:.68em;color:var(--muted)">' + esc(r.date) + (r.time ? ' ' + esc(r.time) : '') + '</div>' +
        '<div style="font-family:JetBrains Mono,monospace;font-size:.68em;color:' + color + '">' + when + '</div>' +
        '<button data-rid="' + r.id + '" onclick="openEditReminderModal(this.dataset.rid)" style="padding:.2rem .5rem;background:transparent;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-size:.65em;font-family:JetBrains Mono,monospace;cursor:pointer">✎</button>';
      listDiv.appendChild(row);
    });
    remBody.appendChild(listDiv);
  } else {
    remBody.innerHTML += '<div style="font-size:.7em;color:var(--dim);font-family:JetBrains Mono,monospace;margin-top:.75rem">No reminders yet — click + Add to create one</div>';
  }

  remSec.appendChild(remBody);
  area.appendChild(remSec);
}

async function sendNudge(subId, taskId) {
  const task = store.tasks[subId]?.find(t => t.id === taskId);
  const sub  = SUBS.find(s => s.id === subId);
  if (!task) return;
  const msg = document.getElementById('nudge-msg').value.trim();
  // Save nudge request to JSONBin — bot picks it up and posts in lead channel
  if (!store.pendingNudges) store.pendingNudges = [];
  store.pendingNudges.push({
    id: makeId(),
    subId,
    taskId,
    taskName: task.name,
    message: msg || null,
    sentAt: Date.now()
  });
  closeModal();
  try {
    await saveData();
    toast('Nudge sent to ' + sub.label + ' lead channel!', 'success');
  } catch { toast('Save failed', 'error'); }
}

// ── MILESTONES ──
function msClass(daysLeft) {
  if (daysLeft < 0) return 'past';
  if (daysLeft <= 7) return 'urgent';
  if (daysLeft <= 30) return 'soon';
  return 'ok';
}

function msDaysLeft(dmy) {
  if (!dmy) return Infinity;
  const p = dmy.split('/');
  if (p.length !== 3) return Infinity;
  const ms = new Date(p[2], p[1]-1, p[0]);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((ms - now) / 86400000);
}

function msTimeLeft(dmy, time) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  let target;
  if (time) {
    const [h, m] = time.split(':').map(Number);
    target = new Date(p[2], p[1]-1, p[0], h, m, 0, 0);
  } else {
    target = new Date(p[2], p[1]-1, p[0], 23, 59, 59, 999);
  }
  const diff = target - new Date();
  if (diff < -3600000) return { past: true, days: Math.ceil(Math.abs(diff)/86400000) };
  const totalSec = Math.max(0, Math.floor(diff / 1000));
  const days  = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins  = Math.floor((totalSec % 3600) / 60);
  const secs  = totalSec % 60;
  return { past: false, days, hours, mins, secs, totalSec };
}

function pad(n) { return String(n).padStart(2, '0'); }

function buildClockHtml(t, cls) {
  if (!t) return '';
  if (t.past) return '<div class="ms-clock"><div class="ms-unit"><span class="ms-digits">' + t.days + '</span><span class="ms-unit-label">DAYS AGO</span></div></div>';
  const secEl = '<div class="ms-unit"><span class="ms-digits" id="ms-sec-' + cls + '">' + pad(t.secs) + '</span><span class="ms-unit-label">SEC</span></div>';
  if (t.days > 0) {
    return '<div class="ms-clock">' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-day-' + cls + '">' + t.days + '</span><span class="ms-unit-label">DAYS</span></div>' +
      '<span class="ms-sep">:</span>' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-hr-' + cls + '">' + pad(t.hours) + '</span><span class="ms-unit-label">HRS</span></div>' +
      '<span class="ms-sep">:</span>' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-min-' + cls + '">' + pad(t.mins) + '</span><span class="ms-unit-label">MIN</span></div>' +
      '<span class="ms-sep">:</span>' +
      secEl +
      '</div>';
  }
  return '<div class="ms-clock">' +
    '<div class="ms-unit"><span class="ms-digits" id="ms-hr-' + cls + '">' + pad(t.hours) + '</span><span class="ms-unit-label">HRS</span></div>' +
    '<span class="ms-sep">:</span>' +
    '<div class="ms-unit"><span class="ms-digits" id="ms-min-' + cls + '">' + pad(t.mins) + '</span><span class="ms-unit-label">MIN</span></div>' +
    '<span class="ms-sep">:</span>' +
    secEl +
    '</div>';
}

function renderMilestoneBar() {
  const bar = document.getElementById('milestone-bar');
  if (!bar) return;
  const milestones = (store.milestones || []).slice().sort((a, b) => parseDmy(a.date) - parseDmy(b.date));
  bar.innerHTML = '';

  milestones.forEach((ms, i) => {
    const daysLeft = msDaysLeft(ms.date);
    const cls = msClass(daysLeft);
    const t = msTimeLeft(ms.date, ms.time);
    const chip = document.createElement('div');
    chip.className = 'milestone-chip ' + cls;
    chip.title = ms.date + (ms.time ? ' ' + ms.time : '') + (ms.description ? ' — ' + ms.description : '');
    chip.innerHTML =
      '<span class="ms-flag">🏁</span>' +
      '<div class="ms-info">' +
        '<div class="ms-name">' + esc(ms.name) + '</div>' +
        '<div class="ms-date">' + esc(ms.date) + (ms.time ? ' ' + esc(ms.time) : '') + (ms.description ? ' · ' + esc(ms.description) : '') + '</div>' +
      '</div>' +
      buildClockHtml(t, 'ms'+i);
    chip.onclick = () => openEditMilestoneModal(i);
    bar.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'ms-add-btn';
  addBtn.textContent = '+ Add milestone';
  addBtn.onclick = openAddMilestoneModal;
  bar.appendChild(addBtn);

  // Tick seconds live
  clearInterval(window._msTicker);
  window._msTicker = setInterval(() => {
    milestones.forEach((ms, i) => {
      const t = msTimeLeft(ms.date, ms.time);
      if (!t || t.past) return;
      const cls = 'ms' + i;
      const secEl = document.getElementById('ms-sec-' + cls);
      const minEl = document.getElementById('ms-min-' + cls);
      const hrEl  = document.getElementById('ms-hr-'  + cls);
      const dayEl = document.getElementById('ms-day-' + cls);
      if (secEl) secEl.textContent = pad(t.secs);
      if (minEl) minEl.textContent = pad(t.mins);
      if (hrEl)  hrEl.textContent  = pad(t.hours);
      if (dayEl) dayEl.textContent = t.days;
      // Full re-render when crossing a day boundary
      if (t.totalSec % 86400 === 0) renderMilestoneBar();
    });
  }, 1000);
}

    <div class="modal-title">👥 Team Members</div>
    <div class="mfield"><label>DISPLAY NAME</label><input type="text" id="m-mname" placeholder="e.g. Eddywin"></div>
    <div class="mfield"><label>DISCORD USER ID</label><input type="text" id="m-mid" placeholder="Right-click user → Copy User ID"></div>
    <div class="modal-footer" style="margin-top:.75rem;margin-bottom:.75rem">
      <button class="mbtn primary" onclick="addMember()">Add Member</button>
    </div>
    <div style="font-size:.62em;letter-spacing:.12em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.5rem">CURRENT MEMBERS</div>
    <div class="member-list">${listHtml}</div>
    <div class="modal-footer"><button class="mbtn secondary" onclick="closeModal()">Close</button></div>
  `);
}

async function addMember() {
  const name = document.getElementById('m-mname').value.trim();
  const id   = document.getElementById('m-mid').value.trim();
  if (!name || !id) { alert('Both name and ID are required.'); return; }
  if (!store.members) store.members = {};
  store.members[id] = name;
  try { await saveData(); toast('Member added', 'success'); renderMembersModal(); }
  catch { toast('Save failed', 'error'); }
}

async function deleteMember(id) {
  if (!confirm(`Remove ${store.members[id] || id}?`)) return;
  delete store.members[id];
  try { await saveData(); toast('Member removed', 'success'); renderMembersModal(); }
  catch { toast('Save failed', 'error'); }
}

// ── MODAL HELPERS ──
function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal')) closeModal(); }

let toastTimer = null;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── INIT ──
loadData().then(startAutoRefresh).catch(() => {
  document.getElementById('sync-info').textContent = 'CONNECTION ERROR';
  document.getElementById('main-area').innerHTML = `<div class="loading" style="color:#e74c3c">Failed to connect</div>`;
});
</script>
</body>
</html>
