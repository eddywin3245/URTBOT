// ── MILESTONES ──
function msClass(daysLeft) {
  if (daysLeft < 0) return 'past';
  if (daysLeft <= 7) return 'urgent';
  if (daysLeft <= 30) return 'soon';
  return 'ok';
}

function msDaysLeft(dmy) {
  if (!dmy) return Infinity;
  const p = dmy.split('/');
  if (p.length !== 3) return Infinity;
  const ms = new Date(p[2], p[1]-1, p[0]);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((ms - now) / 86400000);
}

function msTimeLeft(dmy, time) {
  if (!dmy) return null;
  const p = dmy.split('/');
  if (p.length !== 3) return null;
  let target;
  if (time) {
    const [h, m] = time.split(':').map(Number);
    target = new Date(p[2], p[1]-1, p[0], h, m, 0, 0);
  } else {
    target = new Date(p[2], p[1]-1, p[0], 23, 59, 59, 999);
  }
  const diff = target - new Date();
  if (diff < -3600000) return { past: true, days: Math.ceil(Math.abs(diff)/86400000) };
  const totalSec = Math.max(0, Math.floor(diff / 1000));
  const days  = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins  = Math.floor((totalSec % 3600) / 60);
  const secs  = totalSec % 60;
  return { past: false, days, hours, mins, secs, totalSec };
}

function pad(n) { return String(n).padStart(2, '0'); }

function buildClockHtml(t, cls) {
  if (!t) return '';
  if (t.past) return '<div class="ms-clock"><div class="ms-unit"><span class="ms-digits">' + t.days + '</span><span class="ms-unit-label">DAYS AGO</span></div></div>';
  const secEl = '<div class="ms-unit"><span class="ms-digits" id="ms-sec-' + cls + '">' + pad(t.secs) + '</span><span class="ms-unit-label">SEC</span></div>';
  if (t.days > 0) {
    return '<div class="ms-clock">' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-day-' + cls + '">' + t.days + '</span><span class="ms-unit-label">DAYS</span></div>' +
      '<span class="ms-sep">:</span>' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-hr-' + cls + '">' + pad(t.hours) + '</span><span class="ms-unit-label">HRS</span></div>' +
      '<span class="ms-sep">:</span>' +
      '<div class="ms-unit"><span class="ms-digits" id="ms-min-' + cls + '">' + pad(t.mins) + '</span><span class="ms-unit-label">MIN</span></div>' +
      '<span class="ms-sep">:</span>' +
      secEl +
      '</div>';
  }
  return '<div class="ms-clock">' +
    '<div class="ms-unit"><span class="ms-digits" id="ms-hr-' + cls + '">' + pad(t.hours) + '</span><span class="ms-unit-label">HRS</span></div>' +
    '<span class="ms-sep">:</span>' +
    '<div class="ms-unit"><span class="ms-digits" id="ms-min-' + cls + '">' + pad(t.mins) + '</span><span class="ms-unit-label">MIN</span></div>' +
    '<span class="ms-sep">:</span>' +
    secEl +
    '</div>';
}

function renderMilestoneBar() {
  const bar = document.getElementById('milestone-bar');
  if (!bar) return;
  const milestones = (store.milestones || []).slice().sort((a, b) => parseDmy(a.date) - parseDmy(b.date));
  bar.innerHTML = '';

  milestones.forEach((ms, i) => {
    const daysLeft = msDaysLeft(ms.date);
    const cls = msClass(daysLeft);
    const t = msTimeLeft(ms.date, ms.time);
    const chip = document.createElement('div');
    chip.className = 'milestone-chip ' + cls;
    chip.title = ms.date + (ms.time ? ' ' + ms.time : '') + (ms.description ? ' — ' + ms.description : '');
    chip.innerHTML =
      '<span class="ms-flag">🏁</span>' +
      '<div class="ms-info">' +
        '<div class="ms-name">' + esc(ms.name) + '</div>' +
        '<div class="ms-date">' + esc(ms.date) + (ms.time ? ' ' + esc(ms.time) : '') + (ms.description ? ' · ' + esc(ms.description) : '') + '</div>' +
      '</div>' +
      buildClockHtml(t, 'ms'+i);
    chip.onclick = () => openEditMilestoneModal(i);
    bar.appendChild(chip);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'ms-add-btn';
  addBtn.textContent = '+ Add milestone';
  addBtn.onclick = openAddMilestoneModal;
  bar.appendChild(addBtn);

  // Tick seconds live
  clearInterval(window._msTicker);
  window._msTicker = setInterval(() => {
    milestones.forEach((ms, i) => {
      const t = msTimeLeft(ms.date, ms.time);
      if (!t || t.past) return;
      const cls = 'ms' + i;
      const secEl = document.getElementById('ms-sec-' + cls);
      const minEl = document.getElementById('ms-min-' + cls);
      const hrEl  = document.getElementById('ms-hr-'  + cls);
      const dayEl = document.getElementById('ms-day-' + cls);
      if (secEl) secEl.textContent = pad(t.secs);
      if (minEl) minEl.textContent = pad(t.mins);
      if (hrEl)  hrEl.textContent  = pad(t.hours);
      if (dayEl) dayEl.textContent = t.days;
      // Full re-render when crossing a day boundary
      if (t.totalSec % 86400 === 0) renderMilestoneBar();
    });
  }, 1000);
}

function openAddMilestoneModal() {
  showModal(`
    <div class="modal-title">🏁 Add Milestone</div>
    <div class="mfield"><label>MILESTONE NAME</label><input type="text" id="ms-name" placeholder="e.g. ARCh Competition Day" maxlength="80"></div>
    <div class="mrow"><div class="mfield"><label>DATE</label><input type="date" id="ms-date" style="color-scheme:dark"></div><div class="mfield"><label>TIME (optional)</label><input type="time" id="ms-time" style="color-scheme:dark" placeholder="e.g. 09:00"></div></div>
    <div class="mfield"><label>DESCRIPTION (optional)</label><textarea id="ms-desc" rows="2" placeholder="Any extra details"></textarea></div>
    <div class="modal-footer">
      <button class="mbtn secondary" onclick="closeModal()">Cancel</button>
      <button class="mbtn primary" onclick="addMilestone()" style="background:#9b59b6">Add Milestone</button>
    </div>
  `);
}

async function addMilestone() {
  const name = document.getElementById('ms-name').value.trim();
  const dateRaw = document.getElementById('ms-date').value;
  if (!name || !dateRaw) { alert('Name and date are required.'); return; }
  const date = ymdToDmy(dateRaw);
  const time = document.getElementById('ms-time').value || null;
  const desc = document.getElementById('ms-desc').value.trim();
  if (!store.milestones) store.milestones = [];
  if (!store.meetings)   store.meetings   = [];
  if (!store.goals)     store.goals     = [];
  store.milestones.push({ id: makeId(), name, date, time, description: desc || null });
  closeModal();
  renderMilestoneBar();
  if (activeTab === 'calendar') renderBoard();
  try { await saveData(); toast('Milestone added', 'success'); }
  catch { toast('Save failed', 'error'); }
}

function openEditMilestoneModal(index) {
  const ms = (store.milestones || [])[index];
  if (!ms) return;
  showModal(`
    <div class="modal-title">✎ Edit Milestone</div>
    <div class="mfield"><label>MILESTONE NAME</label><input type="text" id="ms-name" value="${esc(ms.name)}" maxlength="80"></div>
    <div class="mrow"><div class="mfield"><label>DATE</label><input type="date" id="ms-date" value="${esc(dmyToYmd(ms.date))}" style="color-scheme:dark"></div><div class="mfield"><label>TIME (optional)</label><input type="time" id="ms-time" value="${esc(ms.time||"")}" style="color-scheme:dark"></div></div>
    <div class="mfield"><label>DESCRIPTION (optional)</label><textarea id="ms-desc" rows="2">${esc(ms.description || '')}</textarea></div>
    <div class="modal-footer">
      <button class="mbtn secondary" onclick="closeModal()">Cancel</button>
      <button class="mbtn danger" onclick="deleteMilestone(${index})">Delete</button>
      <button class="mbtn primary" onclick="saveMilestone(${index})" style="background:#9b59b6">Save</button>
    </div>
  `);
}

async function saveMilestone(index) {
  const ms = (store.milestones || [])[index];
  if (!ms) return;
  const name = document.getElementById('ms-name').value.trim();
  const dateRaw = document.getElementById('ms-date').value;
  if (!name || !dateRaw) { alert('Name and date are required.'); return; }
  ms.name = name;
  ms.date = ymdToDmy(dateRaw);
  ms.time = document.getElementById('ms-time').value || null;
  ms.description = document.getElementById('ms-desc').value.trim() || null;
  closeModal();
  renderMilestoneBar();
  if (activeTab === 'calendar') renderBoard();
  try { await saveData(); toast('Milestone saved', 'success'); }
  catch { toast('Save failed', 'error'); }
}

async function deleteMilestone(index) {
  if (!confirm('Delete this milestone?')) return;
  store.milestones.splice(index, 1);
  closeModal();
  renderMilestoneBar();
  if (activeTab === 'calendar') renderBoard();
  try { await saveData(); toast('Milestone deleted', 'success'); }
  catch { toast('Save failed', 'error'); }
}

// ── MEMBERS ──
function openMembersModal() { renderMembersModal(); }

function renderMembersModal() {
  const members = store.members || {};
  const listHtml = Object.entries(members).length
    ? Object.entries(members).map(([id, name]) => `
        <div class="member-row">
          <span class="member-name">${esc(name)}</span>
          <span class="member-id">${esc(id)}</span>
          <button class="member-del" onclick="deleteMember('${esc(id)}')" title="Remove">✕</button>
        </div>`).join('')
    : `<div style="color:var(--dim);font-size:.75em;font-family:'JetBrains Mono',monospace;padding:.5rem 0">No members added yet</div>`;
  showModal(`
    <div class="modal-title">👥 Team Members</div>
    <div class="mfield"><label>DISPLAY NAME</label><input type="text" id="m-mname" placeholder="e.g. Eddywin"></div>
    <div class="mfield"><label>DISCORD USER ID</label><input type="text" id="m-mid" placeholder="Right-click user → Copy User ID"></div>
    <div class="modal-footer" style="margin-top:.75rem;margin-bottom:.75rem">
      <button class="mbtn primary" onclick="addMember()">Add Member</button>
    </div>
    <div style="font-size:.62em;letter-spacing:.12em;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.5rem">CURRENT MEMBERS</div>
    <div class="member-list">${listHtml}</div>
    <div class="modal-footer"><button class="mbtn secondary" onclick="closeModal()">Close</button></div>
  `);
}

async function addMember() {
  const name = document.getElementById('m-mname').value.trim();
  const id   = document.getElementById('m-mid').value.trim();
  if (!name || !id) { alert('Both name and ID are required.'); return; }
  if (!store.members) store.members = {};
  store.members[id] = name;
  try { await saveData(); toast('Member added', 'success'); renderMembersModal(); }
  catch { toast('Save failed', 'error'); }
}

async function deleteMember(id) {
  if (!confirm(`Remove ${store.members[id] || id}?`)) return;
  delete store.members[id];
  try { await saveData(); toast('Member removed', 'success'); renderMembersModal(); }
  catch { toast('Save failed', 'error'); }
}

// ── MODAL HELPERS ──
function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal')) closeModal(); }

let toastTimer = null;
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── INIT ──
loadData().then(startAutoRefresh).catch(() => {
  document.getElementById('sync-info').textContent = 'CONNECTION ERROR';
  document.getElementById('main-area').innerHTML = `<div class="loading" style="color:#e74c3c">Failed to connect</div>`;
});
</script>
</body>
</html>
