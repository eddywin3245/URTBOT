name: Backup JSONBin
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and save JSONBin
        env:
          API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
        run: |
          mkdir -p backups
          curl -H "X-Master-Key: ${API_KEY}" \
            "https://api.jsonbin.io/v3/b/${BIN_ID}" \
            -o backups/backup-$(date +%Y-%m-%d).json
      - name: Commit backup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Daily JSONBin backup $(date +%Y-%m-%d)"
          git push
